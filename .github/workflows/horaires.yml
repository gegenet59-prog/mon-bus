# Régénère chaque nuit les horaires théoriques Ilevia et publie le site sur GitHub Pages
name: Horaires et publication

on:
  push:
    branches: [main]
  schedule:
    - cron: "15 1 * * *"   # chaque nuit vers 2h15-3h15 (heure de Paris)
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publier:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Lille (Ilevia)
        run: python3 scripts/build_ville.py LILLE "https://media.ilevia.fr/opendata/gtfs.zip"
      - name: Horaires des TER de la métropole lilloise (SNCF)
        run: python3 scripts/build_ter.py
        continue-on-error: true
      - name: Bordeaux (TBM)
        run: python3 scripts/build_ville.py BORDEAUX "https://bdx.mecatran.com/utw/ws/gtfsfeed/static/bordeaux?apiKey=opendata-bordeaux-metropole-flux-gtfs-rt"
        continue-on-error: true
      - name: Rennes (STAR)
        run: python3 scripts/build_ville.py RENNES "https://eu.ftp.opendatasoft.com/star/gtfs/GTFS_STAR_BUS_METRO_EN_COURS.zip"
        continue-on-error: true
      - name: Amiens (Ametis)
        run: python3 scripts/build_ville.py AMIENS "https://www.data.gouv.fr/api/1/datasets/r/5bc8b7dc-0d4e-48e7-b2ec-eccfe3702c19"
        continue-on-error: true
      - name: Marseille (Métropole Aix-Marseille-Provence)
        run: python3 scripts/build_ville.py MARSEILLE "https://app.mecatran.com/utw/ws/gtfsfeed/static/mamp?apiKey=60327e505a214c77303f52206f11483069257343"
        continue-on-error: true
      - name: Nice (Lignes d'Azur)
        run: python3 scripts/build_ville.py NICE "https://chouette.enroute.mobi/api/v1/datas/OpendataRLA/gtfs.zip"
        continue-on-error: true
      - name: Grenoble (M réso)
        run: python3 scripts/build_ville.py GRENOBLE "https://data.mobilites-m.fr/api/gtfs/SEM"
        continue-on-error: true
      - name: Horaires de Montpellier (TaM)
        run: python3 scripts/build_ville.py MONTPELLIER "https://gtfsproxy.e-tam.fr/COMMON/GTFS.zip"
        continue-on-error: true
      - name: Arrêts et lignes d'Île-de-France (mode PARIS)
        # Le quota PRIM est de 1 000 appels/jour : on régénère seulement la nuit (ou à la main),
        # et à chaque modification du site on reprend les fichiers déjà publiés
        run: |
          SITE="https://gegenet59-prog.github.io/mon-bus/horaires"
          if [ "${{ github.event_name }}" = "push" ] \
             && curl -sfL -o horaires/arrets_paris.json "$SITE/arrets_paris.json" \
             && curl -sfL -o horaires/lignes_paris.json "$SITE/lignes_paris.json" \
             && python3 -c "import json,sys; a=json.load(open('horaires/arrets_paris.json')); sys.exit(0 if len(a[0])==5 else 1)"; then
            echo "Fichiers Paris repris du site publié"
          else
            python3 scripts/build_arrets_paris.py
          fi
        continue-on-error: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deploiement
        uses: actions/deploy-pages@v4
