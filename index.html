<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#d6dcea">
<title>Mon bus</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icone-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%23d6001c'/%3E%3Ctext x='50' y='70' font-size='60' text-anchor='middle'%3E🚌%3C/text%3E%3C/svg%3E">
<style>
  :root { --rouge:#d6001c; --fond:#d6dcea; --texte:#1e2761; --gris:#6b7099; --bleu:#408ec6; --bordeaux:#7a2048; --indigo:#1e2761; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:system-ui,-apple-system,Roboto,sans-serif; background:var(--fond); color:var(--texte); }
  main { padding:16px; max-width:520px; margin:0 auto; }
  form { display:flex; gap:8px; }
  input { flex:1; font-size:17px; padding:14px; border:1px solid #ccc; border-radius:12px; }
  button { font-size:17px; border:0; border-radius:12px; padding:0 18px; background:var(--texte); color:#fff; }
  /* Accueil : bonjour + ville, puis deux grandes tuiles (Autour de moi, Parler) */
  .entete { display:flex; align-items:center; justify-content:space-between; gap:12px; margin:6px 0 14px; }
  .entete .appli { display:block; font-size:13px; font-weight:600; color:var(--bleu); letter-spacing:.2px; }
  .entete #salut { font-size:28px; font-weight:700; color:var(--indigo); line-height:1.1; }
  .tuiles { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:12px; }
  .tuile { display:flex; flex-direction:column; align-items:flex-start; justify-content:space-between; gap:18px; min-height:118px;
           padding:16px; border-radius:22px; color:#fff; text-align:left; font-size:18px; font-weight:700; }
  .tuile svg { width:30px; height:30px; }
  .tuile small { display:block; font-size:12px; font-weight:500; opacity:.85; margin-top:2px; }
  #gps { background:var(--bleu); }
  #micro { background:var(--bordeaux); user-select:none; -webkit-user-select:none; touch-action:none; }
  #micro.ecoute { background:#1a7f37; }
  #micro:disabled { opacity:.6; }
  .aide { color:var(--gris); font-size:14px; margin:10px 2px; }
  #recents { display:flex; flex-wrap:wrap; gap:8px; margin:12px 0; }
  #recents button { background:#fff; color:var(--texte); border:1px solid #ddd; padding:8px 12px; font-size:14px; }
  .arret { background:#fff; border-radius:14px; padding:14px 16px; margin-top:14px; box-shadow:0 1px 3px rgba(0,0,0,.08); }
  .arret h2 { margin:0 0 8px; font-size:16px; }
  .ligne { display:flex; align-items:center; gap:10px; padding:8px 0; border-top:1px solid #eee; }
  .separation { height:18px; }
  .num { min-width:52px; text-align:center; font-weight:800; font-size:17px; color:#fff; background:var(--texte); border-radius:8px; padding:3px 6px; line-height:1.1; }
  .num small { display:block; font-size:10px; font-weight:600; text-transform:uppercase; letter-spacing:.3px; opacity:.9; }
  .sens { flex:1; font-size:15px; }
  .min { font-weight:700; font-size:17px; white-space:nowrap; }
  .min small { display:block; font-weight:400; font-size:12px; color:var(--gris); text-align:right; }
  #statut { margin-top:12px; color:var(--gris); }
  .prevu { color:var(--gris); font-weight:600; }
  .prevu i { font-weight:400; font-size:12px; }
  .retard { color:#c2410c; font-size:13px; }
  .sources { margin-top:28px; font-size:12px; text-align:center; }
  .sources a { color:var(--gris); }
  .supprime { color:#b91c1c; text-decoration:line-through; }
  #villes { position:relative; flex:none; }
  #villeBtn { display:flex; align-items:center; gap:6px; padding:9px 14px; border-radius:999px;
              background:var(--indigo); color:#fff; font-weight:700; font-size:15px; }
  #villeBtn small { font-weight:500; font-size:12px; opacity:.85; }
  #villeBtn .fleche { transition:transform .2s; }
  #villes.ouvert #villeBtn .fleche { transform:rotate(180deg); }
  #villeListe { display:none; position:absolute; right:0; width:260px; top:calc(100% + 6px); z-index:8; background:#fff;
                border-radius:14px; box-shadow:0 8px 24px rgba(0,0,0,.18); max-height:60vh; overflow-y:auto; padding:6px; }
  #villes.ouvert #villeListe { display:block; }
  #villeListe button { width:100%; text-align:left; background:none; color:var(--texte); padding:13px 14px; font-size:16px;
                       font-weight:600; border-radius:10px; display:flex; justify-content:space-between; }
  #villeListe button.actif { background:#f2f2f4; }
  #villeListe button:disabled { color:#aaa; font-weight:500; }
  #villeListe button small { font-weight:500; font-size:12px; color:var(--gris); }
  #villeListe .titre { font-size:12px; color:var(--gris); text-transform:uppercase; padding:10px 14px 4px; letter-spacing:.4px; }
  #toast { position:fixed; left:50%; bottom:24px; transform:translateX(-50%); background:var(--texte); color:#fff;
           padding:10px 16px; border-radius:20px; font-size:14px; opacity:0; transition:opacity .3s; pointer-events:none; z-index:9; }
  #toast.visible { opacity:1; }
  #proches { display:flex; flex-wrap:wrap; gap:8px; margin:-4px 0 12px; }
  #proches button { background:#eef6ff; color:var(--texte); border:1px solid #bcd7f5; padding:8px 12px; font-size:14px; }
  .proche { display:inline-flex; align-items:center; gap:6px; }
  .itin { flex:none; width:36px; height:36px; border-radius:50%; background:#e6f1fb; color:#185fa5; display:inline-flex; align-items:center; justify-content:center; text-decoration:none; }
  .itin:active { transform:scale(.95); }
  h2.avec-itin { display:flex; align-items:center; justify-content:space-between; gap:10px; }
  #favoris { display:flex; flex-wrap:wrap; gap:8px; margin:12px 0; }
  #favoris button { background:#fff; color:var(--texte); border:1px solid #ddd; padding:8px 12px; font-size:14px; }
  .outils-arret { display:flex; align-items:center; gap:8px; }
  .etoile { flex:none; width:36px; height:36px; padding:0; border-radius:50%; background:#fff; color:#c9a227; border:2px solid #f2c94c; font-size:20px; line-height:1; }
  .etoile.cochee { background:#fff8d6; }
  .actions { display:flex; gap:8px; margin-top:10px; border-top:1px solid #eee; padding-top:10px; }
  .actions button { flex:1; padding:10px; font-size:14px; background:#f2f2f4; color:var(--texte); }
  .trafic h2 { color:#b45309; }
  /* Itinéraire : bandeau d'accueil + écran séparé */
  .bandeauIti { width:100%; display:flex; justify-content:space-between; align-items:center; background:var(--indigo); color:#fff;
                border-radius:16px; padding:13px 16px; margin:-2px 0 12px; font-size:17px; font-weight:700; }
  .bandeauIti small { font-size:13px; font-weight:500; opacity:.85; }
  #ecranIti { display:none; }
  body.iti main > *:not(#ecranIti) { display:none !important; }
  body.iti #ecranIti { display:block; }
  .barreIti { display:flex; align-items:center; gap:10px; margin:4px 0 14px; }
  .barreIti h1 { margin:0; font-size:24px; color:var(--indigo); }
  #itiRetour { background:#fff; color:var(--indigo); width:40px; height:40px; padding:0; border-radius:50%; font-size:20px; }
  .champsIti { display:grid; grid-template-columns:1fr auto; gap:8px; align-items:center; }
  .champsIti input { width:100%; box-sizing:border-box; }
  #itiInverser { grid-row:1 / span 2; grid-column:2; background:#fff; color:var(--indigo); width:44px; height:44px; padding:0; border-radius:50%; font-size:20px; }
  #itiOk { width:100%; margin-top:10px; padding:13px; }
  #itiSuggestions { display:flex; flex-direction:column; gap:4px; margin-top:8px; }
  #itiSuggestions button { background:#fff; color:var(--texte); text-align:left; padding:11px 12px; font-size:15px; border:1px solid #e3e6ef; }
  .carteIti { background:#fff; border-radius:14px; padding:12px 14px; margin-top:12px; box-shadow:0 1px 3px rgba(0,0,0,.08); cursor:pointer; }
  .enteteIti { display:flex; justify-content:space-between; gap:8px; font-size:13px; color:var(--gris); }
  .dureeIti { font-weight:700; font-size:17px; color:var(--texte); white-space:nowrap; }
  .lignesIti { display:flex; flex-wrap:wrap; align-items:center; gap:6px; margin-top:8px; }
  .lignesIti .fleche { color:var(--gris); font-size:18px; }
  .etapesIti { display:none; margin:10px 0 2px; padding-left:20px; font-size:14px; line-height:1.5; }
  .carteIti.ouverte .etapesIti { display:block; }
  .etapesIti li { margin-bottom:10px; }
  .etapesIti .num { display:inline-block; min-width:40px; font-size:14px; vertical-align:middle; }
  .quandIti { display:flex; gap:6px; margin-top:10px; }
  .quandIti button { flex:1; padding:10px; font-size:15px; background:#fff; color:var(--texte); border:1px solid #d5d9e6; }
  .quandIti button.actif { background:var(--indigo); color:#fff; border-color:var(--indigo); }
  #itiHeure { width:100%; box-sizing:border-box; margin-top:8px; }
  .rouleIti { color:#1a7f37; font-size:13px; font-weight:600; white-space:nowrap; }
  .dortIti { color:#7a2048; font-size:13px; font-weight:600; }
  .dortCarte { opacity:.92; border:1px dashed #c9b3c0; }
  .arretIti { background:none; color:var(--bleu); padding:0; font-size:14px; font-weight:600; text-decoration:underline; }
  /* Pannes métro / tram de la ville (bandeau d'accueil) et réglage des alertes */
  .entete-droite { display:flex; align-items:center; gap:8px; }
  #cloche { width:40px; height:40px; padding:0; border-radius:50%; background:#fff; color:var(--indigo); font-size:18px; }
  #cloche.active { background:#fff3c4; }
  #pannes { margin:-2px 0 12px; }
  .panne { background:#fdecec; border:1px solid #f3b4b4; color:#7f1d1d; border-radius:14px; padding:10px 14px; margin-bottom:8px; font-size:15px; }
  .panne summary { cursor:pointer; font-weight:600; }
  .panne p { margin:8px 0 2px; white-space:pre-line; font-size:14px; color:#4a1515; }
  #panneauAlertes { margin:0 0 12px; }
  #panneauAlertes h2 { margin:0 0 6px; font-size:16px; }
  .choixLignes { display:flex; flex-wrap:wrap; gap:6px; margin:10px 0; }
  .choixLignes label { display:inline-flex; align-items:center; gap:4px; padding:7px 10px; border:1px solid #ccd; border-radius:999px; font-size:14px; background:#fff; }
  .choixLignes input { margin:0; }
  .choixLignes label:has(input:checked) { background:#e7efff; border-color:var(--bleu); font-weight:600; }
  .boutonsAlertes { display:flex; gap:8px; }
  .boutonsAlertes button { flex:1; padding:11px; font-size:15px; }
  .boutonsAlertes .secondaire { background:#f2f2f4; color:var(--texte); }
  .trafic details { border-top:1px solid #eee; padding:8px 0; font-size:14px; }
  .trafic summary { cursor:pointer; }
  .trafic p { white-space:pre-line; margin:8px 0 0; color:#333; }
</style>
</head>
<body>
<main>
  <div class="entete">
    <div><span class="appli">Mon bus</span><span id="salut">Bonjour</span></div>
    <div class="entete-droite"><button id="cloche" aria-label="Alertes de panne métro et tram">🔔</button><div id="villes"></div></div>
  </div>
  <div id="panneauAlertes" class="arret" hidden></div>
  <div id="toast"></div>
  <div class="tuiles">
    <button id="gps" class="tuile"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s-7-6.2-7-11.5a7 7 0 0 1 14 0C19 14.8 12 21 12 21Z"/><circle cx="12" cy="9.5" r="2.5"/></svg><span>Autour de moi</span></button>
    <button id="micro" class="tuile" aria-label="Parler : reste appuyé pour dire l'arrêt et la ligne"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg><span><span id="microTexte">Parler</span><small id="microAide">Reste appuyé</small></span></button>
  </div>
  <button id="itiBtn" class="bandeauIti"><span>🧭 Itinéraire</span><span>›</span></button>
  <div id="pannes"></div>
  <div id="proches"></div>
  <form id="formulaire">
    <input id="question" placeholder="ex : 14 C1 République Beaux-Arts" autocomplete="off">
    <button>OK</button>
  </form>
  <p class="aide" id="aideVille"></p>
  <div id="favoris"></div>
  <div id="recents"></div>
  <div id="statut"></div>
  <div id="resultats"></div>
  <section id="ecranIti">
    <div class="barreIti"><button id="itiRetour" aria-label="Retour">←</button><h1>Itinéraire</h1></div>
    <div class="champsIti">
      <input id="itiDepart" placeholder="Départ : arrêt ou adresse" autocomplete="off">
      <button id="itiInverser" aria-label="Inverser départ et arrivée">⇅</button>
      <input id="itiArrivee" placeholder="Arrivée : arrêt ou adresse" autocomplete="off">
    </div>
    <div class="quandIti"><button id="itiMaintenant" class="actif">Partir maintenant</button><button id="itiPlusTard">Partir à…</button></div>
    <input id="itiHeure" type="datetime-local" hidden>
    <div id="itiSuggestions"></div>
    <button id="itiOk">Chercher l'itinéraire</button>
    <div id="itiResultats"></div>
  </section>
  <p class="aide sources">Données : <a href="https://data.lillemetropole.fr">Ilevia / Métropole Européenne de Lille</a> ·
    <a href="https://transport.data.gouv.fr/datasets/horaires-sncf">SNCF Voyageurs</a> (ODbL) ·
    <a href="https://prim.iledefrance-mobilites.fr">Île-de-France Mobilités – PRIM</a> ·
    <a href="https://transport.data.gouv.fr">autres réseaux via transport.data.gouv.fr</a>.
    Horaires mis à jour chaque nuit, temps réel en direct.</p>
</main>
<script>
const WFS = "https://data.lillemetropole.fr/geoserver/wfs";
const $ = id => document.getElementById(id);

// Mots à ignorer dans la question
const VIDES = new Set("LE LA LES ET OU A AU AUX DE DU DES D L UN UNE BUS TRAM LIGNE LIGNES DANS COMBIEN TEMPS PASSE PASSENT QUAND PROCHAIN PROCHAINS PROCHAINE ARRET ARRIVE ARRIVENT EST CE QUE QUI QUEL QUELLE QUELS HEURE HEURES MINUTES DIS MOI VERS DIRECTION SVP STP PASSAGE PASSAGES".split(" "));
const CHIFFRES = { UN:"1", DEUX:"2", TROIS:"3", QUATRE:"4", CINQ:"5", SIX:"6", SEPT:"7", HUIT:"8", NEUF:"9", DIX:"10" };

function normaliser(t) {
  return t.normalize("NFD").replace(/[̀-ͯ]/g, "").toUpperCase()
          .replace(/[-'’.,?!()/]/g, " ").replace(/\s+/g, " ").trim();
}

// Sépare la question en lignes (14, CO1, L1...) et en nom d'arrêt
function analyser(question) {
  let mots = normaliser(question).split(" ").filter(Boolean);
  // Recolle "CO 1", "C O 1", "LIANE 1", "L 1" -> C1 / L1
  const res = [];
  for (let i = 0; i < mots.length; i++) {
    let m = mots[i], suivant = mots[i + 1], apres = mots[i + 2];
    const chiffre = s => s && (/^\d+$/.test(s) ? s : CHIFFRES[s]);
    // Lille : CO = Corolle (CO1, CO2…), C = Citadine (C1, C1A, C1B…)
    if ((m === "CO" || m === "COROLLE") && chiffre(suivant)) { res.push("CO" + chiffre(suivant)); i++; continue; }
    if (m === "CITADINE" && chiffre(suivant)) { res.push("C" + chiffre(suivant)); i++; continue; }
    if (m === "C" && suivant === "O" && chiffre(apres)) { res.push("CO" + chiffre(apres)); i += 2; continue; }
    if ((m === "LIANE" || m === "L") && chiffre(suivant)) { res.push("L" + chiffre(suivant)); i++; continue; }
    if (m === "C" && chiffre(suivant)) { res.push("C" + chiffre(suivant)); i++; continue; }
    // Mode précisé : « métro 1 », « bus 14 », « RER A », « tram 3a », « transilien H », « TER »…
    // -> filtre "MODE:CODE" (CODE = * si aucun numéro : « le métro à Gare Lille Flandres »)
    const code = x => x && (chiffre(x) || (/^[A-Z]{0,4}\d{1,3}[AB]?$/.test(x) ? x : null));
    if (m === "RER" && /^[A-E]$/.test(suivant || "")) { res.push("#RER:" + suivant); i++; continue; }
    // Métro à lettre (Rennes a/b) ; « métro à … » reste un mot vide à Lille et Paris
    if (m === "METRO" && (/^[B-Z]$/.test(suivant || "") || (suivant === "A" && !["LILLE", "PARIS"].includes(VILLE)))) { res.push("#METRO:" + suivant); i++; continue; }
    if (m === "METRO" || m === "M") { if (chiffre(suivant)) { res.push("#METRO:" + chiffre(suivant)); i++; } else if (m === "METRO") res.push("#METRO:*"); else res.push(m); continue; }
    if (m === "TRAM" || m === "TRAMWAY") {
      // Lille : une seule ligne de tram, R = branche Roubaix, T = branche Tourcoing
      if (VILLE === "LILLE" && (suivant === "R" || suivant === "T")) { res.push("#TRAM:*", "§" + (suivant === "R" ? "ROUBAIX" : "TOURCOING")); i++; continue; }
      // Tram à lettre (Bordeaux A/B/C/D, Grenoble A…E) ; « tram à … » reste un mot vide à Lille et Paris
      if (/^[B-Z]$/.test(suivant || "") || (suivant === "A" && !["LILLE", "PARIS"].includes(VILLE))) { res.push("#TRAM:T" + suivant); i++; continue; }
      if (code(suivant)) { res.push("#TRAM:T" + code(suivant).replace(/^[TL](?=\d)/, "").replace(/^T/, "")); i++; } else res.push("#TRAM:*");
      continue;
    }
    if (m === "BUS" || m === "NOCTILIEN") { if (code(suivant)) { res.push("#BUS:" + code(suivant)); i++; } else res.push("#BUS:*"); continue; }
    if (m === "TRANSILIEN" || m === "TRAIN") { if (/^[A-Z]$/.test(suivant || "") && suivant !== "A") { res.push("#TRAIN:" + suivant); i++; } else res.push("#TRAIN:*"); continue; }
    if (m === "TER") { res.push("#TRAIN:*"); continue; }
    res.push(m);
  }
  const lignes = [], arret = [];
  arret.direction = []; // mots placés après « direction » / « vers » : sens voulu, pas le nom de l'arrêt
  let versLeSens = false, precedent = "";
  for (const m of res) {
    if (m === "DIRECTION" || m === "VERS") { versLeSens = true; continue; }
    if (m.startsWith("§")) { arret.direction.push(m.slice(1)); arret.push(m.slice(1)); continue; }
    if (versLeSens && !m.startsWith("#") && !VIDES.has(m)) arret.direction.push(m);
    if (m.startsWith("#")) lignes.push(m.slice(1));
    else if (/^M\d{1,2}$/.test(m)) lignes.push("METRO:" + m.slice(1));
    else if (/^\d{1,3}$/.test(m) || /^[A-Z]{1,4}\d{1,3}[AB]?$/.test(m)) lignes.push("*:" + m);
    else if (!VIDES.has(m) || (m === "EST" && (precedent === "L" || m === res[res.length - 1]))) arret.push(m);   // « Gare de l'Est », « Longs Champs Est »
    precedent = m;
  }
  // Nom fait uniquement de mots vides (« Temps Passé ») : on garde les mots tels quels
  if (!arret.length) arret.push(...res.filter(m => !m.startsWith("#") && !m.startsWith("§") && !/^\d{1,3}$/.test(m)));
  const recolle = recoller(arret);
  recolle.direction = recoller(arret.direction);
  // Phrase entière sans les lignes (« Mairie de Vers-sur-Selle », « Les Iris ») et nombres tapés (« Village 4 », « Terminal 2 »)
  recolle.brut = recoller(res.filter(m => !m.startsWith("#") && !m.startsWith("§") && !/^M\d{1,2}$/.test(m)
                                          && (/^\d+$/.test(m) || !/^[A-Z]{1,4}\d{1,3}[AB]?$/.test(m)))).join(" ");
  recolle.nombres = res.filter(m => /^\d{1,3}$/.test(m));
  return { lignes, arret: recolle };
}

// Une ligne affichée correspond-elle au filtre "MODE:CODE" ?
// "C1" garde C1A et C1B ; à Lille le métro s'appelle M1/M2 dans les données
function correspond(it, filtre) {
  const [mode, code] = filtre.split(":");
  if (mode !== "*" && it.mode !== mode) return false;
  if (code === "*") return true;
  const c = (it.ligne || "").toUpperCase();
  // Trams écrits autrement selon les réseaux : « 2 » (Montpellier), « L1 » (Nice), « A » (Bordeaux, Grenoble) = T2, T1, TA
  if (mode === "TRAM" && "T" + c.replace(/^L(?=\d)/, "") === code) return true;
  return [c, c.replace(/[AB]$/, ""), c.replace(/^M(?=\d)/, "")].includes(code);
}

// Citadine C1 : le flux affiche "Porte des Postes" dans les deux sens.
// On retrouve le sens grâce au quai (code d'arrêt physique), relevé dans le flux temps réel.
// Boucle A : Porte des Postes -> Cormontaigne -> ... -> CHU -> Porte des Postes
// Boucle B : Porte des Postes -> CHU -> ... -> Cormontaigne -> Porte des Postes
const BOUCLES = {
  C1: {
    A: "PDP004 LBM001 RLE001 ISL002 LFU002 COR002 LCB001 CHQ002 SAC002 NAT003 REP005 ARJ003 RTA001 RUW001 ARA003 PRR003 FBG004 RDL001 TIM003 GEY001 LCI001 ARB001 GID001 CAL002 LBE002 CAV002 TSS002 SIM002".split(" "),

async function chargerTempsReel(nomArret, quais) {

    return (await (await fetch(`${WFS}?${params}`)).json()).features.map(f => f.properties);
  }
  const mots = nomArret.split(" ").filter(m => m.length >= 2).map(m => m.replace(/'/g, ""));

    service: "WFS", version: "2.0.0", request: "GetFeature",

// Un nom d'arrêt « colle » à la question si tous ses mots utiles (hors le, de, la…) y sont
// « C H DRON » (C.H. Dron) = « CH DRON » : on recolle les lettres seules qui se suivent (sauf A, D, L… qui sont des mots vides)
function recoller(mots) {
  const seule = x => /^[A-Z]$/.test(x) && !VIDES.has(x);
  const res = [];
  let enCours = false;   // le dernier mot gardé est fait de lettres seules
  for (const m of mots) {
    if (seule(m) && enCours) res[res.length - 1] += m;
    else { res.push(m); enCours = seule(m); }
  }
  return res;
}
// Mots qui comptent dans un nom d'arrêt (« Deloye / Dubouchage », « Victoire (Somme) » : ponctuation retirée).
// EST est gardé après L (« Gare de l'Est ») ou en fin de nom (« Longs Champs Est ») ; nom fait de mots vides (« Temps Passé ») : on garde tout
const motsUtiles = nom => {
  const w = recoller(normaliser(nom).split(" ").filter(Boolean));
  const u = w.filter((m, i, a) => !VIDES.has(m) || (m === "EST" && (a[i - 1] === "L" || i === a.length - 1)));
  return u.length ? u : w;
};
// Deux mots « pareils » malgré une faute de frappe ou un pluriel (FLANDRE / FLANDRES, REPUBLIQE / REPUBLIQUE)
const ABREV = { ST: "SAINT", STE: "SAINTE", GL: "GENERAL", PL: "PLACE", AV: "AVENUE", BD: "BOULEVARD" };
function proche(a, b) {
  a = ABREV[a] || a; b = ABREV[b] || b;
  if (a === b) return true;
  if (Math.min(a.length, b.length) >= 3 && (a + "S" === b || b + "S" === a || a + "X" === b || b + "X" === a)) return true;
  if (a.length < 4 || b.length < 4) return false;
  if (Math.abs(a.length - b.length) > 1 || Math.min(a.length, b.length) < 5) return false;
  let i = 0, j = 0, diff = 0;          // au plus une lettre différente (en trop, en moins ou changée)
  while (i < a.length && j < b.length) {
    if (a[i] === b[j]) { i++; j++; continue; }
    if (++diff > 1) return false;
    if (a.length > b.length) i++; else if (b.length > a.length) j++; else { i++; j++; }
  }
  return diff + (a.length - i) + (b.length - j) <= 1;
}
// Choix de l'arrêt : celui dont tous les mots sont dans la question et qui en reprend le plus
// (« Gare Lille Flandre » -> GARE LILLE FLANDRES, et pas l'arrêt « GARE »)
function meilleurNom(noms, arret) {
  // « tram 1 Comédie direction Odysseum » : on cherche d'abord l'arrêt sans les mots de direction
  // Nom tapé en entier, mot pour mot (« Les Iris » et pas « Iris », « Mairie de Vers-sur-Selle ») : c'est lui
  if (arret.brut) {
    const exact = noms.find(n => !NOMS_ECARTES.has(n) && recoller(normaliser(n).split(" ")).join(" ") === arret.brut);
    if (exact) return (DERNIER_NOM = exact);
  }
  if (arret.direction?.length) {
    const sans = arret.filter(m => !arret.direction.includes(m));
    sans.nombres = arret.nombres;
    const n = sans.length && meilleurNom(noms, sans);
    if (n) return n;
  }
  const mots = [...arret, ...(arret.nombres || [])];   // « Village 4 » : le 4 départage Village 4 / Village 5
  const score = n => {
    const nw = motsUtiles(n);
    const m = nw.filter(w => mots.some(q => proche(w, q))).length;
    const qm = mots.filter(q => nw.some(w => proche(w, q))).length;
    const ex = mots.filter(q => nw.includes(q)).length;   // mots identiques (« Verger » plutôt que « Berger »)
    return { complet: nw.length > 0 && m === nw.length, m, qm, ex, part: nw.length ? m / nw.length : 0, len: nw.length };
  };
  let best = null, bs = null;
  for (const n of noms) {
    if (NOMS_ECARTES.has(n)) continue;
    const sc = score(n);
    if (!sc.m) continue;
    // ordre de préférence : nom complet > mots de la question retrouvés > part du nom retrouvée > nom le plus précis
    // > à égalité, le nom le plus court (« Castellane » plutôt que « La Castellane »)
    const cmp = !bs ? 1
      : (sc.complet - bs.complet) || (sc.qm - bs.qm) || (sc.ex - bs.ex) || (sc.part - bs.part) || (sc.len - bs.len)
        || (best.split(" ").length - n.split(" ").length);
    const mieux = cmp > 0;
    if (mieux) { best = n; bs = sc; }
  }
  return (DERNIER_NOM = best);
}
// « C3 Dron » : si l'arrêt choisi n'a pas la ligne demandée (Gustave Dron), on écarte ce nom et on réessaie
let NOMS_ECARTES = new Set(), DERNIER_NOM = null;

// Libellé d'une direction prévue : le sens temps réel qui lui ressemble le plus (sinon la direction elle-même)
function libelleur(items) {
  const sensConnus = {};
  for (const it of items) (sensConnus[it.ligne] ??= new Set()).add(it.sens);
  return (ligne, direction) => {
    const mots = normaliser(direction).split(" ");
    let best = null, bestScore = 0, egalite = false;
    for (const s of sensConnus[ligne] || []) {
      // Part des mots du sens temps réel retrouvés (CHATEAU -> 1/1 bat WAMBRECHIES AGRIPPIN -> 1/2)
      const sc = s.split(" ").filter(m => mots.includes(m)).length / s.split(" ").length;
      if (sc > bestScore) { best = s; bestScore = sc; egalite = false; }
      else if (sc === bestScore && sc > 0) egalite = true;
    }
    return best && !egalite ? best : normaliser(direction);
  };
}

// ===================== Point d'entrée =====================
// opts.force : arrêt déjà connu (Autour de moi) · opts.silencieux : rafraîchissement auto · opts.voix : lire la réponse
let DERNIERE = null;
async function chercher(question, opts = {}) {
  question = question.trim();
  if (!question) return;
  let { lignes, arret } = analyser(question);
  // « 4 Cantons » : le 4 fait partie du nom de l'arrêt, ce n'est pas la ligne 4
  const sansNumeroDuNom = r => r?.nom ? lignes.filter(f => !(f.startsWith("*:") && normaliser(r.nom).split(" ").includes(f.slice(2)))) : lignes;
  if (!arret.length) { $("statut").textContent = "Je n'ai pas compris l'arrêt. " + (EXEMPLES[VILLE] || ""); return; }
  if (!opts.silencieux) {
    $("statut").textContent = "Recherche…"; $("resultats").innerHTML = "";
    if (!opts.force) $("proches").innerHTML = "";   // les boutons d'arrêts restent seulement si on choisit parmi eux
  }
  let r;
  try {
    if (VILLE === "PARIS") r = await chercherParis(arret, opts.force, lignes);
    else {
      NOMS_ECARTES = new Set();
      let premier = null;
      for (let essai = 0; essai < 3; essai++) {
        DERNIER_NOM = null;
        const cherche = f => VILLE === "LILLE" ? chercherLille(arret, f) : chercherGtfs(villeActuelle(), arret, f);
        r = await cherche(opts.force);
        premier ??= r;
        const l = sansNumeroDuNom(r);
        const aLaLigne = x => x.items.some(it => l.some(f => correspond(it, f)));
        if (!r || opts.force || !l.length || !DERNIER_NOM || aLaLigne(r)) break;
        // « C1 Wagner » : même nom ailleurs (Wattrelos) ? on regarde d'abord les autres arrêts de ce nom
        const choix = CHOIX_SECTEURS;
        let trouve = null;
        for (const sct of choix?.secteurs.slice(1) || []) {
          const x = await cherche({ nom: choix.nom, ids: sct.ids, commune: sct.commune });
          if (x && aLaLigne(x)) { trouve = x; break; }
        }
        CHOIX_SECTEURS = choix;
        if (trouve) { r = trouve; break; }
        NOMS_ECARTES.add(DERNIER_NOM);
        r = null;
      }
      r ??= premier;
      NOMS_ECARTES = new Set();
    }
    lignes = sansNumeroDuNom(r);
  }
  catch (e) { NOMS_ECARTES = new Set(); if (!opts.silencieux) $("statut").textContent = "Problème de connexion. Réessaie dans un instant."; return; }
  if (!r) { $("statut").textContent = "Arrêt introuvable. Vérifie le nom."; return; }
  // Ancien favori (simple nom, ex. « Wagner ») : on le remplace par l'arrêt précis qui vient de s'afficher (« Wagner (Lille) »)
  if (opts.ancienFavori && r.precis) {
    const n = titre(r.titre || r.nom), vus = new Set();
    ecrireListe("favoris", lireListe("favoris").map(x => x === opts.ancienFavori ? { n, f: r.precis } : x)
      .filter(x => !vus.has(nomFavori(x)) && vus.add(nomFavori(x))));
    montrerRecents();
  }
  DERNIERE = { question, force: opts.force, ville: VILLE, t: opts.silencieux && DERNIERE ? DERNIERE.t : Date.now() };
  if (CHOIX_SECTEURS && !opts.silencieux) {
    const { nom, secteurs } = CHOIX_SECTEURS;
    $("proches").innerHTML = "";
    secteurs.forEach((sct, n) => {
      const b = document.createElement("button");
      b.textContent = `📍 ${titre(nom)} ${sct.commune ? "· " + sct.commune : "· n°" + (n + 1)}${POSITION ? " · " + Math.round(distance(...POSITION, sct.a, sct.b) / 100) / 10 + " km" : ""}`;
      b.onclick = () => chercher(question, { force: { nom, ids: sct.ids, commune: sct.commune } });
      $("proches").appendChild(b);
    });
    toast(`Il y a ${secteurs.length} arrêts « ${titre(nom)} » : choisis le bon dans les boutons`);
  }
  CHOIX_SECTEURS = null;

  // Filtres : lignes demandées ("C1" garde C1A et C1B), puis direction (mots restants de la phrase)
  const maintenant = new Date();
  let liste = r.items.filter(it => it.h >= new Date(maintenant.getTime() - 60000));
  if (lignes.length) liste = liste.filter(it => lignes.some(f => correspond(it, f)));
  // mots de la phrase qui ne sont pas le nom de l'arrêt (fautes tolérées) -> direction éventuelle
  // (le nom affiché compte aussi : « Gare du Nord (Paris) » -> PARIS n'est pas une direction)
  const restants = arret.filter(m => !recoller(normaliser(r.nom + " " + (r.titre || "")).split(" ")).some(w => proche(w, m)));
  // Le temps réel de Lille raccourcit certains terminus : « Roubaix Eurotéléport » devient « Eurotéléport »
  const voulus = restants.flatMap(m => [m, ...(VILLE === "LILLE" && m === "ROUBAIX" ? ["EUROTELEPORT"] : [])]);
  const avecSens = liste.filter(it => recoller(normaliser(it.sens).split(" ")).some(m => voulus.includes(m)));
  if (avecSens.length) liste = avecSens;
  // « Même recherche » = même arrêt + mêmes lignes + même direction, quelle que soit l'écriture (Flandre / Flandres…)
  opts.cle = [normaliser(r.nom), [...lignes].sort().join(","), restants.join(" ")].join("|");
  afficher(r, liste, question, opts);
}

// ===================== LILLE (Ilevia) =====================
// Mode et couleurs d'une ligne Ilevia (type GTFS : 0 tram, 1 métro, 3 bus)
function habillerLille(it) {
  const [type, couleur, texte] = LIGNES_LILLE[it.ligne.replace(/^(C\d+)[AB]$/, "$1")] || [3];
  const mode = type === 1 ? "METRO" : type === 0 ? "TRAM" : "BUS";
  return { ...it, mode, nomMode: { METRO: "Métro", TRAM: "Tram", BUS: "Bus" }[mode],
           code: mode === "METRO" ? it.ligne.replace(/^M/, "") : mode === "TRAM" ? "" : it.ligne, couleur, texte };
}
async function chercherLille(arret, force) {
  const index = await chargerIndex();
  const gares = await chargerGaresTer();
  const nomsGares = Object.fromEntries(gares.map(g => [normaliser(g[1]), g]));
  const nom = force?.nom || meilleurNom([...Object.keys(index), ...Object.keys(nomsGares)], arret) || arret.join(" ");
  let tempsReel = [], tempsReelOk = true;
  // Arrêt précis (Autour de moi, favori, bouton de choix) ; sinon les arrêts de ce nom, regroupés par secteur :
  // Wagner existe à Lille ET à Wattrelos -> on garde le plus proche de toi (ou le premier) et on propose l'autre en bouton
  let ids = force?.ids ? [...force.ids] : force?.id ? [force.id] : [...(index[nom] || [])];
  let commune = force?.commune || "";
  if (!force && ids.length > 1) {
    try {
      ARRETS_LILLE ??= await (await fetch("horaires/lille/arrets.json")).json();
      const pos = Object.fromEntries(ARRETS_LILLE.map(a => [a[0], a]));
      const secteurs = [];
      for (const id of ids) {
        const p = pos[id]; if (!p) continue;
        const sct = secteurs.find(x => distance(x.a, x.b, p[3], p[4]) < 1000);
        if (sct) sct.ids.push(id); else secteurs.push({ a: p[3], b: p[4], ids: [id], commune: titre(p[2] || "") });
      }
      if (secteurs.length > 1) {
        for (const sct of secteurs) if (!sct.commune) sct.commune = voisinDe(ARRETS_LILLE, sct.a, sct.b, nom);
        if (POSITION) secteurs.sort((x, y) => distance(...POSITION, x.a, x.b) - distance(...POSITION, y.a, y.b));
        CHOIX_SECTEURS = { nom, secteurs };
        ids = [...secteurs[0].ids]; commune = secteurs[0].commune;
      }
    } catch {}
  }
  const choisis = [...ids];   // l'arrêt retenu, avant d'y ajouter ses voisins (c'est lui qu'on met en favori)
  // Comme Ilevia, on réunit les arrêts voisins au nom proche : « 4 Cantons Stade » (bus) + « 4 Cantons Stade Pierre Mauroy » (métro)
  try {
    ARRETS_LILLE ??= await (await fetch("horaires/lille/arrets.json")).json();
    const ici = ARRETS_LILLE.filter(a => ids.includes(a[0]));
    const motsDe = s => normaliser(s).split(" ");
    for (const [id, n2, , a, b] of ARRETS_LILLE) {
      if (ids.includes(id)) continue;
      const proche250 = ici.some(x => distance(x[3], x[4], a, b) < 250);
      const m1 = motsDe(nom), m2 = motsDe(n2);
      if (proche250 && m2.length >= 2 && (m2.every(w => m1.includes(w)) || m1.every(w => m2.includes(w)))) ids.push(id);
    }
  } catch {}
  const fichiers = (await Promise.all(ids.map(id => chargerCompact("lille", id)))).filter(Boolean);
  // codes de quais (pour le temps réel Ilevia) et type/couleurs des lignes, lus dans les fichiers de l'arrêt
  const quais = [...new Set(fichiers.flatMap(f => f.q))];
  for (const f of fichiers) for (const [code, type, couleur, texte] of f.l) LIGNES_LILLE[code] = [type, couleur, texte];
  try { tempsReel = await chargerTempsReel(nom, quais); } catch { tempsReelOk = false; }
  const prevus = [];
  for (const f of fichiers) for (const [d, lignes] of Object.entries(f.j))
    for (const [min, li, si, qi] of lignes) prevus.push([d, min, f.l[li][0], f.s[si], f.q[qi]]);

  const maintenant = new Date(), items = [];
  for (const p of tempsReel) {
    const q = preciserBoucle(p);
    // L'heure du flux finit par "Z" mais c'est déjà l'heure locale : on retire le Z
    items.push({ ligne: q.code_ligne, sens: normaliser(q.sens_ligne), h: new Date(p.heure_estimee_depart.replace("Z", "")), prevu: false });
  }
  const libelle = libelleur(items);
  const limite = maintenant.getTime() + 36 * 3600000;
  for (const [d, min, ligne, direction, quai] of prevus) {
    const h = new Date(+d.slice(0, 4), +d.slice(4, 6) - 1, +d.slice(6, 8), 0, min); // 1510 min = lendemain 01:10
    if (h < maintenant || h > limite) continue;
    const q = preciserBoucle({ code_ligne: ligne, code_arret_physique: quai, sens_ligne: direction });
    items.push({ ligne: q.code_ligne, sens: q.code_ligne !== ligne ? normaliser(q.sens_ligne) : libelle(ligne, direction), h, prevu: true });
  }
  for (let i = 0; i < items.length; i++) items[i] = habillerLille(items[i]);

  // TER : la gare portant ce nom, ou les gares à moins de 500 m de l'arrêt choisi
  let garesProches = nomsGares[nom] ? [nomsGares[nom]] : [];
  if (!garesProches.length && ids.length) {
    ARRETS_LILLE ??= await (await fetch("horaires/lille/arrets.json")).json().catch(() => []);
    const pos = ARRETS_LILLE.filter(a => ids.includes(a[0]));
    garesProches = gares.filter(g => pos.some(a => distance(a[3], a[4], g[2], g[3]) < 500));
  }
  if (garesProches.length) items.push(...await trainsTer(garesProches, maintenant, limite, nom));
  ARRETS_LILLE ??= await (await fetch("horaires/lille/arrets.json")).json().catch(() => []);
  // La commune n'est ajoutée au nom que s'il existe ailleurs un arrêt du même nom : « Wagner (Lille) »
  const ici = ARRETS_LILLE.filter(a => choisis.includes(a[0]));
  const homonyme = ici.length && (index[nom] || []).some(id => {
    const a = ARRETS_LILLE.find(x => x[0] === id);
    return a && ici.every(x => distance(x[3], x[4], a[3], a[4]) > 1000);
  });
  if (homonyme && !commune) commune = voisinDe(ARRETS_LILLE, ici[0][3], ici[0][4], nom);
  return { nom, titre: homonyme ? `${titre(nom)} (${commune})` : nom, items, tempsReelOk, position: positionDe(ARRETS_LILLE, ids, 3),
           precis: { nom, ids: choisis, commune } };
}

// ===================== TER (SNCF) dans la métropole lilloise =====================
let GARES_TER = null;
const CACHE_TER = {};
async function chargerGaresTer() {
  if (!GARES_TER) {
    try { GARES_TER = await (await fetch("horaires/ter/gares.json")).json(); } catch { GARES_TER = []; }
  }
  return GARES_TER;
}

// Lecture minimale du format protobuf (GTFS-RT) : pas de bibliothèque à charger
function lireProto(buf, debut = 0, fin = buf.length) {
  const champs = [];
  let i = debut;
  const varint = () => { let r = 0n, d = 0n, o; do { o = buf[i++]; r |= BigInt(o & 127) << d; d += 7n; } while (o & 128); return r; };
  while (i < fin) {
    const cle = Number(varint()), num = cle >> 3, type = cle & 7;
    if (type === 0) champs.push([num, varint()]);
    else if (type === 2) { const n = Number(varint()); champs.push([num, [i, i + n]]); i += n; }
    else if (type === 1) i += 8;
    else if (type === 5) i += 4;
    else break;
  }
  return champs;
}
const texteProto = (buf, [a, b]) => new TextDecoder().decode(buf.subarray(a, b));
const entier = v => { const n = BigInt.asIntN(64, v); return Number(n); };

// Retards et suppressions SNCF : flux national léger (seuls les trains perturbés y figurent).
// Relu au plus une fois par minute. Clé : n° de train + date -> { supprime, gares: { UIC: { retard, supprime } } }
let RT_SNCF = { t: 0, data: null };
async function retardsSncf() {
  if (RT_SNCF.data && Date.now() - RT_SNCF.t < 60000) return RT_SNCF.data;
  const buf = new Uint8Array(await (await fetch("https://proxy.transport.data.gouv.fr/resource/sncf-gtfs-rt-trip-updates")).arrayBuffer());
  const data = {};
  for (const [n, ent] of lireProto(buf)) {
    if (n !== 2) continue;
    for (const [m, tu] of lireProto(buf, ...ent)) {
      if (m !== 3) continue;
      let tripId = "", date = "", supprime = false;
      const gares = {};
      for (const [k, v] of lireProto(buf, ...tu)) {
        if (k === 1) for (const [x, y] of lireProto(buf, ...v)) {
          if (x === 1) tripId = texteProto(buf, y);
          if (x === 3) date = texteProto(buf, y);
          if (x === 4 && y === 3n) supprime = true;          // CANCELED
        }
        if (k === 2) {
          let stop = "", retard = null, saute = false;
          for (const [x, y] of lireProto(buf, ...v)) {
            if ((x === 2 || x === 3) && Array.isArray(y)) for (const [a, b] of lireProto(buf, ...y)) if (a === 1 && (x === 3 || retard === null)) retard = entier(b);
            if (x === 4) stop = texteProto(buf, y);
            if (x === 5 && y === 1n) saute = true;             // SKIPPED
          }
          const uic = stop.split("-").pop();
          if (uic) gares[uic] = { retard, supprime: saute };
        }
      }
      const numero = (tripId.match(/OCESN(\d+)[A-Z]/) || [])[1];
      if (!numero) continue;
      // Un même train peut apparaître plusieurs fois : on fusionne les informations
      const cle = `${numero}|${date || (tripId.match(/:(\d{8})(?::\d+)?$/) || [])[1]}`;
      const deja = data[cle];
      data[cle] = deja ? { supprime: deja.supprime || supprime, gares: { ...deja.gares, ...gares } } : { supprime, gares };
    }
  }
  RT_SNCF = { t: Date.now(), data };
  return data;
}

async function trainsTer(gares, maintenant, limite, nomArret = "") {
  let rt = {};
  try { rt = await retardsSncf(); } catch {}
  const items = [];
  for (const [uic, nomGare] of gares) {
    if (!CACHE_TER[uic]) { try { CACHE_TER[uic] = await (await fetch(`horaires/ter/${uic}.json`)).json(); } catch { CACHE_TER[uic] = []; } }
    for (const [d, hm, ligne, destination, numero, couleur, texte] of CACHE_TER[uic]) {
      const [H, M] = hm.split(":").map(Number);
      const prevue = new Date(+d.slice(0, 4), +d.slice(4, 6) - 1, +d.slice(6, 8), H, M);
      const info = rt[`${numero}|${d}`];
      const g = info?.gares?.[uic];
      const retard = g?.retard ? Math.round(g.retard / 60) : 0;
      const h = new Date(prevue.getTime() + retard * 60000);
      if (h < new Date(maintenant.getTime() - 60000) || prevue > limite) continue;
      items.push({ ligne, code: ligne, mode: "TRAIN", nomMode: "TER", sens: normaliser(destination) + (gares.length > 1 && !normaliser(nomGare).split(" ").every(m => nomArret.split(" ").includes(m)) ? ` (DEPUIS ${normaliser(nomGare)})` : ""), h, couleur, texte,
                   prevu: !info, retard, supprime: !!(info?.supprime || g?.supprime), independant: true,
                   });
    }
  }
  return items;
}

// ===================== MOTEUR COMMUN (Bordeaux, Rennes… : GTFS + GTFS-RT) =====================
const INDEX_GTFS = {}, CACHE_GTFS = {}, RT_GTFS = {};
let CHOIX_SECTEURS = null;
const NOMS_MODES = { 0: ["TRAM", "Tram"], 1: ["METRO", "Métro"], 2: ["TRAIN", "Train"], 3: ["BUS", "Bus"], 4: ["BUS", "Bateau"],
                     5: ["TRAM", "Tram"], 6: ["BUS", "Téléphérique"], 7: ["TRAM", "Funiculaire"], 11: ["BUS", "Trolley"] };

// Temps réel GTFS-RT d'un réseau (relu au plus toutes les 30 s) :
// trajets[trip_id] = { supprime, maj: [{ seq, stop, retard, heure, saute }] } et routes[route_id] = trajets du flux
async function tempsReelGtfs(url) {
  const c = RT_GTFS[url];
  if (c && Date.now() - c.t < 30000) return c.data;
  const buf = new Uint8Array(await (await fetch(url)).arrayBuffer());
  const trajets = {};
  for (const [n, ent] of lireProto(buf)) {
    if (n !== 2) continue;
    for (const [m, tu] of lireProto(buf, ...ent)) {
      if (m !== 3) continue;
      let tripId = "", route = "", supprime = false;
      const maj = [];
      for (const [k, v] of lireProto(buf, ...tu)) {
        if (k === 1) for (const [x, y] of lireProto(buf, ...v)) {
          if (x === 1) tripId = texteProto(buf, y);
          if (x === 5) route = texteProto(buf, y);
          if (x === 4 && y === 3n) supprime = true;          // CANCELED
        }
        if (k === 2) {
          const u = { seq: null, stop: "", retard: null, heure: null, saute: false };
          for (const [x, y] of lireProto(buf, ...v)) {
            if (x === 1) u.seq = Number(y);
            if (x === 4) u.stop = texteProto(buf, y);
            if (x === 5 && y === 1n) u.saute = true;           // SKIPPED
            if ((x === 2 || x === 3) && Array.isArray(y)) for (const [a, b] of lireProto(buf, ...y)) {
              if (a === 1 && (x === 3 || u.retard === null)) u.retard = entier(b);
              if (a === 2 && (x === 3 || u.heure === null) && b > 0n) u.heure = Number(b);
            }
          }
          maj.push(u);
        }
      }
      if (tripId) trajets[tripId] = { route, supprime, maj };
    }
  }
  RT_GTFS[url] = { t: Date.now(), data: trajets };
  return trajets;
}

async function chercherGtfs(conf, arret, force) {
  const dossier = `horaires/${conf.gtfs}`;
  INDEX_GTFS[conf.id] ??= await (await fetch(`${dossier}/stations.json`)).json().then(d => d.stations).catch(() => ({}));
  const index = INDEX_GTFS[conf.id];
  const nom = force?.nom || meilleurNom(Object.keys(index), arret);
  if (!nom) return null;
  let ids = force?.ids || (force?.id ? [force.id] : (index[nom] || []));
  let choixCommune = force?.commune || "";
  // Même nom à plusieurs endroits (communes différentes) : on regroupe par secteur et on propose le choix
  if (!force && ids.length > 1) {
    ARRETS_GTFS[conf.id] ??= await (await fetch(`${dossier}/arrets.json`)).json().catch(() => []);
    const pos = Object.fromEntries(ARRETS_GTFS[conf.id].map(a => [a[0], a]));
    const secteurs = [];
    for (const id of ids) {
      const p = pos[id]; if (!p) continue;
      const s = secteurs.find(x => distance(x.a, x.b, p[3], p[4]) < 1000);
      if (s) s.ids.push(id); else secteurs.push({ a: p[3], b: p[4], ids: [id], commune: p[2] });
    }
    if (secteurs.length > 1) {
      // Sans nom de commune dans les données : on situe chaque secteur par l'arrêt voisin le plus proche
      for (const sct of secteurs) if (!sct.commune) sct.commune = voisinDe(ARRETS_GTFS[conf.id], sct.a, sct.b, nom);
      if (POSITION) secteurs.sort((x, y) => distance(...POSITION, x.a, x.b) - distance(...POSITION, y.a, y.b));
      CHOIX_SECTEURS = { nom, secteurs };
      ids = secteurs[0].ids;   // le plus proche de toi (ou le premier), les autres sont proposés en boutons
      choixCommune = secteurs[0].commune;
    }
  }
  const fichiers = await Promise.all(ids.map(async id => {
    const cle = `${conf.id}/${id}`;
    if (!CACHE_GTFS[cle]) { try { CACHE_GTFS[cle] = await (await fetch(`${dossier}/${id}.json`)).json(); } catch { CACHE_GTFS[cle] = null; } }
    return CACHE_GTFS[cle];
  }));

  const maintenant = new Date(), limite = maintenant.getTime() + 36 * 3600000;
  const items = [];
  for (const f of fichiers) {
    if (!f) continue;
    for (const [d, lignes] of Object.entries(f.j)) {
      const minuit = new Date(+d.slice(0, 4), +d.slice(4, 6) - 1, +d.slice(6, 8));
      for (const [min, li, si, qi, ti, seq, vi] of lignes) {
        const h = new Date(minuit.getTime() + min * 60000);
        if (h < maintenant - 30 * 60000 || h > limite) continue;    // marge de 30 min pour les bus en retard
        const [code, type, couleur, texte, route] = f.l[li];
        const [mode, nomMode] = NOMS_MODES[type] || NOMS_MODES[3];
        const c = code.toUpperCase().replace(/^0+(?=\d)/, "");   // Nice écrit « 05 » : on affiche et on cherche « 5 »
        items.push({ ligne: c, code: c, mode, nomMode, couleur, texte, route, sens: normaliser(f.s[si]),
                     h, prevue: h, quai: f.q[qi], trip: f.t[ti], seq, via: vi !== undefined ? normaliser(f.s[vi]) : "",
                     prevu: true, independant: true });
      }
    }
  }

  // Temps réel : par trajet (identifiant commun), sinon rattachement par ligne + quai + heure la plus proche
  let tempsReelOk = !conf.rt;
  if (conf.rt) {
    try {
      const rt = await tempsReelGtfs(conf.rt);
      tempsReelOk = true;
      const appliquer = (it, u, supprime) => {
        if (supprime || u.saute) it.supprime = true;
        if (u.heure) it.h = new Date(u.heure * 1000);
        else if (u.retard !== null) it.h = new Date(it.prevue.getTime() + u.retard * 1000);
        it.retard = Math.round((it.h - it.prevue) / 60000);
        it.prevu = false;
      };
      const quais = new Set(items.map(i => i.quai));
      const utilises = new Set();
      for (const it of items) {
        const t = rt[it.trip];
        if (!t) continue;
        // la mise à jour de cet arrêt, sinon la dernière avant lui (le retard se propage)
        let u = t.maj.find(x => x.stop === it.quai) || [...t.maj].reverse().find(x => x.seq !== null && x.seq <= it.seq && x.seq > 0);
        if (u || t.supprime) { appliquer(it, u || {}, t.supprime); utilises.add(it.trip); }
      }
      for (const [tripId, t] of Object.entries(rt)) {
        if (utilises.has(tripId)) continue;
        for (const u of t.maj) {
          if (!quais.has(u.stop) || !u.heure) continue;
          const vrai = u.heure * 1000;
          const candidats = items.filter(i => i.prevu && i.quai === u.stop && (!t.route || i.route === t.route)
                                              && Math.abs(i.prevue - vrai) < 20 * 60000);
          const c = candidats.sort((a, b) => Math.abs(a.prevue - vrai) - Math.abs(b.prevue - vrai))[0];
          if (c) appliquer(c, u, t.supprime);
        }
      }
    } catch { tempsReelOk = false; }
  }
  // Boucles : même ligne + même direction affichée sur deux quais différents -> on précise « via l'arrêt suivant »
  const quaisParSens = {};
  for (const i of items) (quaisParSens[`${i.mode}|${i.ligne}|${i.sens}`] ??= new Set()).add(i.quai);
  for (const i of items) if (quaisParSens[`${i.mode}|${i.ligne}|${i.sens}`].size > 1 && i.via) i.sens = `${i.sens} (VIA ${i.via})`;
  // Ligne circulaire qui affiche l'arrêt où l'on est (« → Port Lympia » à Port Lympia) : on dit « Boucle via l'arrêt suivant »
  const ici = x => proche(x.replace(/ /g, ""), normaliser(nom).replace(/ /g, ""));
  for (const i of items) if (i.via && ici(i.sens.split(" (VIA")[0])) i.sens = ici(i.via) ? "" : `BOUCLE (VIA ${i.via})`;
  for (let k = items.length - 1; k >= 0; k--) if (!items[k].sens) items.splice(k, 1);   // il va juste à l'autre quai du terminus : pas un départ
  const liste = items.filter(i => i.h >= new Date(maintenant.getTime() - 60000));
  ARRETS_GTFS[conf.id] ??= await (await fetch(`${dossier}/arrets.json`)).json().catch(() => []);
  return { nom, titre: choixCommune && (force || CHOIX_SECTEURS) && (index[nom] || []).length > 1 ? `${titre(nom)} (${choixCommune})` : nom,
           items: liste, tempsReelOk, precis: { nom, ids, commune: choixCommune },
           position: positionDe(ARRETS_GTFS[conf.id], ids, 3) };
}

// ===================== PARIS (Île-de-France Mobilités / PRIM) =====================
// Clé PRIM gratuite (compte de Nice). Elle est visible ici : si elle est abusée, en régénérer une sur PRIM.
const PRIM = "https://prim.iledefrance-mobilites.fr/marketplace";
const CLE_PRIM = "4nXb9R6YGCqMyntuh0GmKY3U8xtlSk27";
// Quota PRIM : 1 000 appels/jour par API, partagés entre tous les utilisateurs. On économise :
// arrêts et lignes lus dans des fichiers préparés la nuit, prévu gardé 10 min, temps réel seul à l'actualisation.
let QUOTA_ATTEINT = false;
const prim = async chemin => {
  const r = await fetch(PRIM + chemin, { headers: { apikey: CLE_PRIM } });
  if (r.status === 429) QUOTA_ATTEINT = true;
  if (!r.ok) throw new Error("PRIM " + r.status);
  return r.json();
};
const LIGNES_IDFM = {}; // C01371 -> { code, couleur, texte }
let LIGNES_PARIS_CHARGEES = false, LIGNES_PARIS_OK = false;
async function infoLigne(id, trainLong) {
  if (!LIGNES_PARIS_CHARGEES) {
    LIGNES_PARIS_CHARGEES = true;
    try {
      const toutes = await (await fetch("horaires/lignes_paris.json")).json();
      for (const [num, [code, couleur, texte, nomMode, nomLigne]] of Object.entries(toutes))
        LIGNES_IDFM[num] ??= { code, couleur, texte, nomMode, nomLigne };
      LIGNES_PARIS_OK = true;
    } catch {}
  }
  // Ligne absente de la liste de la nuit (souvent un grand train SNCF) : pas d'appel à l'API, on l'affiche comme « Train »
  if (!LIGNES_IDFM[id] && LIGNES_PARIS_OK) LIGNES_IDFM[id] = trainLong ? { code: "", nomMode: "Train" } : { code: "", nomMode: "Bus" };
  if (!LIGNES_IDFM[id]) {
    try {
      const l = (await prim(`/v2/navitia/lines/line:IDFM:${id}`)).lines[0];
      LIGNES_IDFM[id] = { code: l.code, couleur: l.color, texte: l.text_color, nomMode: l.commercial_mode?.name, nomLigne: l.name };
    } catch { LIGNES_IDFM[id] = { code: id }; }
  }
  return LIGNES_IDFM[id];
}
// Heure Navitia "20261030T220700" (heure de Paris)
const dateNavitia = s => new Date(+s.slice(0, 4), +s.slice(4, 6) - 1, +s.slice(6, 8), +s.slice(9, 11), +s.slice(11, 13), +s.slice(13, 15));
// Mode d'une ligne d'Île-de-France d'après son nom commercial (Métro, RER, Bus, Tramway, Transilien, TER…)
function habillerParis(it, nomMode = "", nomLigne = "") {
  const n = normaliser(nomMode);
  // Bus de remplacement (travaux) : « Bus Remplacement RER D » -> badge « BUS RER » + D
  const remplacement = normaliser(nomLigne).match(/REMPLACEMENT (RER|TRANSILIEN|TRAM|METRO)/);
  if (remplacement) return { ...it, mode: "BUS", nomMode: "Bus " + { RER: "RER", TRANSILIEN: "Transilien", TRAM: "Tram", METRO: "Métro" }[remplacement[1]] };
  // Téléphérique (Câble C1), funiculaire de Montmartre, Orlyval / CDG VAL : rangés en « navettes », en dernier
  if (/CABLEWAY|TELEPHERIQUE|FUNICULAIRE|ORLYVAL|CDG VAL/.test(n))
    return { ...it, mode: "NAVETTE", nomMode: n.includes("FUNICULAIRE") ? "Funiculaire" : /CABLE|TELEPH/.test(n) ? "Téléphérique" : "Navette" };
  const mode = n.includes("METRO") ? "METRO" : n === "RER" ? "RER" : n.includes("TRAM") ? "TRAM"
             : /TRANSILIEN|TER|TRAIN/.test(n) ? "TRAIN" : "BUS";
  const nom = { METRO: "Métro", RER: "RER", TRAM: "Tram", BUS: n.includes("NOCTILIEN") ? "Noctilien" : "Bus" }[mode]
            || (n.includes("TRANSILIEN") ? "Transilien" : n.includes("TER") ? "TER" : "Train");
  // Pas de doublon « TER TER » : le code est vide s'il répète le nom du mode

const sansCommune = s => s.replace(/\s*\(.*?\)\s*/g, " ").trim(); // "La Défense (Puteaux)" -> "La Défense"

async function chercherParis(arret, force, lignes = []) {
  if (force?.zone) return chargerZoneParis(force.zone, normaliser(force.zone.name), force.zone.id.split(":").pop());
  // « RER A Châtelet » : si l'arrêt le plus ressemblant n'a pas la ligne demandée (Châtelet métro),
  // on essaie les suivants (Châtelet - Les Halles), 3 au plus
  const zones = await trouverZonesParis(arret, lignes);
  let premier = null;
  for (const zone of zones.slice(0, 3)) {
    const r = await chargerZoneParis(zone, normaliser(zone.name), zone.id.split(":").pop());
    premier ??= r;
    if (!lignes.length || r.items.some(it => lignes.some(f => correspond(it, f)))) return r;
  }
  return premier;
}

// Arrêt parisien, cherché dans la liste préparée la nuit (sans appel à l'API) ; renvoie les meilleurs, dans l'ordre.
// Ordre : nom complet retrouvé > mots de la question retrouvés > part du nom retrouvée > station ferrée (métro, RER…)
// > à Paris > plus proche de toi (si position connue) > nom le plus court
async function trouverZonesParis(arret, lignes = []) {
  let liste = null;
  try { ARRETS_PARIS ??= await (await fetch("horaires/arrets_paris.json")).json(); liste = ARRETS_PARIS; } catch {}
  if (!liste?.length || liste[0].length < 5) return trouverZonesParisApi(arret);   // ancien fichier : on passe par l'API
  const mots = arret.direction?.length && arret.some(m => !arret.direction.includes(m)) ? arret.filter(m => !arret.direction.includes(m)) : arret;
  const nombres = lignes.filter(f => f.startsWith("*:")).map(f => f.slice(2));
  // Surnoms courants : Roissy / CDG = aéroport, Disneyland = Marne-la-Vallée - Chessy, Arc de Triomphe = Étoile
  let mots2 = [...mots];
  if (mots2.includes("CDG") || (mots2.length === 1 && mots2[0] === "ROISSY")) mots2 = [...mots2.filter(m => m !== "ROISSY"), "AEROPORT", "CDG"];
  if (mots2.some(m => m === "DISNEY" || m === "DISNEYLAND")) mots2 = ["MARNE", "VALLEE", "CHESSY"];
  if (mots2.includes("ARC") && mots2.includes("TRIOMPHE")) mots2 = ["CHARLES", "GAULLE", "ETOILE"];
  if (mots2.includes("ORLY") && mots2.every(m => ["ORLY", "AEROPORT", "TERMINAL", "TERMINAUX"].includes(m))) mots2 = [...new Set([...mots2, "AEROPORT"])];
  return classerZonesParis(liste, mots2, nombres);
}
function classerZonesParis(liste, mots, nombres) {
  const cands = [];
  for (const [num, label, la, lo, ferre] of liste) {
    const nw = motsUtiles(normaliser(label.replace(/\s*\([^)]*\)\s*$/, "")));   // sans la commune finale, garde « (Terminal 4) »
    // « Vélizy 2 », « 8 Mai 1945 » : un numéro pris pour une ligne compte aussi s'il est dans le nom
    const m = nw.filter(w => mots.some(q => proche(w, q)) || nombres.includes(w)).length;
    if (!nw.some(w => mots.some(q => proche(w, q)))) continue;
    const exacts = [...mots, ...nombres].filter(q => nw.includes(q)).length;   // Bercy plutôt que Burcy
    // les mots de la question absents du nom peuvent être la commune (« Mairie Montreuil »)
    const commune = normaliser((label.match(/\(([^)]*)\)\s*$/) || [])[1] || "");
    const horsNom = mots.filter(q => !nw.some(w => proche(w, q)));
    const dansCommune = commune && horsNom.some(q => commune.split(" ").some(w => proche(w, q)));
    const qm = mots.length - horsNom.length + (dansCommune ? 1 : 0);
    cands.push({ num, label, la, lo, ferre, complet: m === nw.length ? 1 : 0, qm, exacts, part: m / nw.length, len: nw.length,
                 paris: commune === "PARIS" ? 1 : 0, m: POSITION ? distance(POSITION[0], POSITION[1], la, lo) : 0 });
  }
  // mots retrouvés > mots exacts > près de toi (< 1,5 km) > station ferrée > nom complet > part du nom > Paris > distance > court
  const pres = c => POSITION && c.m < 1500 ? 1 : 0;
  cands.sort((x, y) => (y.qm - x.qm) || (y.exacts - x.exacts) || (pres(y) - pres(x)) || (y.ferre - x.ferre) || (y.complet - x.complet)
    || (y.part - x.part) || (y.paris - x.paris) || (x.m - y.m) || (x.len - y.len));
  return cands.slice(0, 5).map(c => ({ id: `stop_area:IDFM:${c.num}`, name: c.label.replace(/\s*\([^)]*\)\s*$/, ""), label: c.label }));
}
// Secours si la liste de la nuit manque : recherche par l'API (coûte des appels)
async function trouverZonesParisApi(arret) {
  const trouves = {};
  const res = await prim(`/v2/navitia/places?q=${encodeURIComponent(arret.join(" "))}&type%5B%5D=stop_area&count=8`).catch(() => ({}));
  for (const p of res.places || []) if (p.stop_area && !trouves[normaliser(p.stop_area.name)]) trouves[normaliser(p.stop_area.name)] = p.stop_area;
  const zones = [];
  for (let i = 0; i < 3; i++) { const n = meilleurNom(Object.keys(trouves), arret); if (!n) break; zones.push(trouves[n]); delete trouves[n]; }

}

const PREVU_PARIS = {};
async function chargerZoneParis(zone, nom, num) {
  // Prévu (Navitia) et temps réel (SIRI) en parallèle
  // Le prévu est gardé 10 min (l'actualisation automatique ne redemande que le temps réel)
  const cache = PREVU_PARIS[zone.id];
  const [dep, sm] = await Promise.all([
    cache && Date.now() - cache.t < 600000 ? cache.dep
      : prim(`/v2/navitia/stop_areas/${zone.id}/departures?count=150&data_freshness=base_schedule`)
          .then(dep => (PREVU_PARIS[zone.id] = { t: Date.now(), dep }).dep).catch(() => ({ departures: [] })),
    prim(`/stop-monitoring?MonitoringRef=${encodeURIComponent(`STIF:StopArea:SP:${num}:`)}`).catch(() => null)
  ]);
  const items = [];
  for (const d of dep.departures || []) {
    const id = (d.route?.line?.id || "").split(":").pop();
    const di = d.display_informations;
    if (id) LIGNES_IDFM[id] ??= { code: di.code, couleur: di.color, texte: di.text_color, nomMode: di.commercial_mode, nomLigne: d.route?.line?.name };
  }
  const visites = sm?.Siri?.ServiceDelivery?.StopMonitoringDelivery?.[0]?.MonitoredStopVisit || [];
  for (const v of visites) {
    const j = v.MonitoredVehicleJourney, c = j.MonitoredCall || {};
    const t = c.ExpectedDepartureTime || c.ExpectedArrivalTime || c.AimedDepartureTime || c.AimedArrivalTime;
    const id = (j.LineRef?.value || "").split(":").filter(Boolean).pop();
    const dest = j.DestinationName?.[0]?.value || j.DirectionName?.[0]?.value || "";
    if (!t || !id) continue;
    const info = await infoLigne(id, (j.VehicleFeatureRef || []).includes("longTrain"));
    items.push(habillerParis({ ligne: (info.code || id).toUpperCase(), code: info.code ?? id, sens: normaliser(dest), h: new Date(t), prevu: false,
                               couleur: info.couleur, texte: info.texte }, info.nomMode, info.nomLigne));
  }
  const libelle = libelleur(items);
  for (const d of dep.departures || []) {
    const di = d.display_informations;
    const code = (di.code || "").toUpperCase();
    items.push(habillerParis({ ligne: code, code: di.code || "", sens: libelle(code, sansCommune(di.direction || "")),
                 h: dateNavitia(d.stop_date_time.departure_date_time), prevu: true, couleur: di.color, texte: di.text_color }, di.commercial_mode, d.route?.line?.name));
  }
  try { ARRETS_PARIS ??= await (await fetch("horaires/arrets_paris.json")).json(); } catch {}
  return { nom, titre: zone.label || zone.name, items, tempsReelOk: !!sm, precis: { zone }, perturbationsParis: dep.disruptions || [],
           position: positionDe(ARRETS_PARIS, [num], 2) };
}

// Par ligne + direction : les bus en temps réel, complétés par les horaires prévus
// (seulement APRÈS le dernier bus en temps réel, pour ne pas compter deux fois le même bus)
function afficher(r, liste, question, opts) {
  const arret = r.titre, maintenant = new Date();
  if (!liste.length) { $("statut").textContent = "Aucun passage trouvé. Vérifie le nom de l'arrêt ou la ligne."; return; }
  if (!opts.silencieux) memoriser(question, opts.cle);
  $("statut").textContent = `Mis à jour à ${hhmm(maintenant)}` + (opts.silencieux ? " · auto" : "")
    + (r.tempsReelOk ? "" : " · temps réel indisponible, horaires prévus seulement")
    + (VILLE === "PARIS" && QUOTA_ATTEINT ? " · limite d'appels du jour atteinte chez Île-de-France Mobilités" : "");

  const groupes = {};
  for (const it of liste) (groupes[it.mode + "|" + it.ligne + "|" + it.sens] ??= []).push(it);
  const lignesAff = [];
  for (const [cle, tous] of Object.entries(groupes)) {
    if (tous.every(i => i.independant)) {   // TER : chaque horaire est un train différent
      lignesAff.push([cle, [...tous].sort((a, b) => a.h - b.h).slice(0, 2)]);
      continue;
    }
    const reels = tous.filter(i => !i.prevu).sort((a, b) => a.h - b.h);
    const prevus = tous.filter(i => i.prevu).sort((a, b) => a.h - b.h);
    const dernierReel = reels.length ? reels[reels.length - 1].h.getTime() + 2 * 60000 : 0;
    const choix = reels.slice(0, 3);
    for (const p of prevus) {
      if (choix.length >= 2) break;
      if (p.h.getTime() > dernierReel) choix.push(p);
    }
    if (choix.length) lignesAff.push([cle, choix]);

    || String(a[1][0].code ?? a[1][0].ligne).localeCompare(String(b[1][0].code ?? b[1][0].ligne), "fr", { numeric: true })
    || a[0].split("|")[2].localeCompare(b[0].split("|")[2], "fr"));

  let html = `<div class="arret"><h2 class="avec-itin"><span>${titre(arret)}</span><span class="outils-arret">`
    + `<button id="btnFavori" class="etoile${estFavori(titre(arret)) ? " cochee" : ""}" `
    + `title="${estFavori(titre(arret)) ? "Retirer des favoris" : "Ajouter aux favoris"}" aria-label="Favori">`
    + `${estFavori(titre(arret)) ? "★" : "☆"}</button>${boutonItineraire(r.position, arret)}</span></h2>`;
  let rangPrecedent = null;
  for (const [cle, choix] of lignesAff) {
    const sens = cle.split("|")[2];
    const [premier, ...suivants] = choix;
    if (rangPrecedent !== null && rangMode(premier) !== rangPrecedent) html += `<div class="separation"></div>`;
    rangPrecedent = rangMode(premier);
    const style = premier.couleur ? ` style="background:#${premier.couleur};color:#${premier.texte || "FFFFFF"}"` : "";
    html += `<div class="ligne"><span class="num"${style}><small>${premier.nomMode || ""}</small>${premier.code ?? premier.ligne}</span><span class="sens">→ ${titre(sens)}</span>
             <span class="min">${quand(premier, maintenant)}${suivants.length ? `<small>puis ${suivants.map(p => quand(p, maintenant, true)).join(", ")}</small>` : ""}</span></div>`;
  }
  html += `<div class="actions"><button id="btnEcouter">🔊 Écouter</button></div>`;
  if (VILLE === "LILLE" && lignesAff.some(([, c]) => c[0].mode === "TRAIN"))
    html += `<p class="aide">🎫 Les tickets Ilevia sont valables dans le TER pour voyager entre deux gares de la métropole.
             <a href="https://www.ter.sncf.com/hauts-de-france/tarifs-cartes/autres-tarifs-ter/tarifs-transports-en-commun/voyager-en-ter-aux-tarifs-ilevia">Conditions sur ter.sncf.com</a></p>`;
  html += `</div><div id="trafic"></div><p class="aide">📡 = temps réel · <i>prévu</i> = horaire théorique ${VILLE === "PARIS" ? "Île-de-France Mobilités" : VILLE === "LILLE" ? "Ilevia / SNCF" : villeActuelle().source || ""} · mise à jour auto ${VILLE === "PARIS" ? "chaque minute pendant 10 min" : "toutes les 30 s"}</p>`;
  $("resultats").innerHTML = html;
  // Étoile à côté du nom : met l'ARRÊT en favori (juste son nom ; un clic dessus montre toutes ses lignes)
  // (on garde l'arrêt PRÉCIS : « Wagner » de Lille et pas celui de Wattrelos)
  $("btnFavori").onclick = () => { basculerFavori(titre(arret), r.precis); afficher(r, liste, question, { silencieux: true }); };
  $("btnEcouter").onclick = () => parler(arret, lignesAff);
  if (opts.voix) parler(arret, lignesAff);

// Rang d'un type de transport à l'affichage : 0 trains (Transilien…), 1 TER, 2 RER, 3 tram, 4 métro, 5 bus, 6 navettes
function rangMode(it) {
  const nom = normaliser(it.nomMode || "");
  if (/NAVETTE|BATEAU|TELEPHERIQUE|FUNICULAIRE/.test(nom) || /NAVETTE/.test(normaliser(String(it.code ?? "")))) return 6;
  if (it.mode === "TRAIN") return nom.includes("TER") ? 1 : 0;
  return { RER: 2, TRAM: 3, METRO: 4, BUS: 5 }[it.mode] ?? 5;
}

const hhmm = d => d.toLocaleTimeString("fr-FR", { hour: "2-digit", minute: "2-digit" });
function quand(p, maintenant, petit) {
  const min = Math.floor((p.h - maintenant) / 60000);
  const demain = p.h.toDateString() !== maintenant.toDateString();
  if (p.supprime) return `<span class="supprime">${hhmm(p.h)} supprimé</span>`;
  let txt = demain ? `demain ${hhmm(p.h)}` : min <= 0 ? "à l'approche" : min < 60 ? `${min} min` : hhmm(p.h);
  if (p.retard > 0) txt += ` <span class="retard">+${p.retard}</span>`;
  return p.prevu ? `<span class="prevu">${txt} <i>prévu</i></span>` : `${txt}${petit ? "" : " 📡"}`;
}

// Majuscules en début de mot ; un nom déjà bien écrit (« Gare de l'Est ») est gardé tel quel
const titre = s => /[a-zà-ÿ]/.test(s) ? s : s.toLowerCase().replace(/(?<=^|[\s(])\S/g, c => c.toUpperCase());

// Questions récentes (gardées sur ce téléphone)
// Listes gardées sur ce téléphone, séparées par ville (« recents » sans suffixe = Lille, pour garder l'historique)
const cleListe = nom => (nom === "recents" && VILLE === "LILLE") ? "recents" : `${nom}_${VILLE}`;
function lireListe(nom) { try { return JSON.parse(localStorage.getItem(cleListe(nom)) || "[]"); } catch { return []; } }

}
function memoriser(q, cle) {
  const garder = lireListe("recents").filter(x => cle ? !memeRecherche(x, cle) : normaliser(texteRecent(x)) !== normaliser(q));
  ecrireListe("recents", [cle ? { q, k: cle } : q, ...garder].slice(0, 5));

const nomFavori = x => typeof x === "string" ? x : x.n;

  montrerRecents();
}
function montrerRecents() {
  // Favoris : gros boutons ⭐ (✕ pour retirer)
  $("favoris").innerHTML = "";
  for (const x of lireListe("favoris")) {
    // Petites pastilles comme les anciens « derniers arrêts » ; on retire un favori avec l'étoile de son résultat
    const q = nomFavori(x);
    const b = document.createElement("button"); b.textContent = "⭐ " + q;
    b.onclick = () => { $("question").value = q; chercher(q, x.f ? { force: x.f } : { ancienFavori: q }); };
    $("favoris").appendChild(b);
  }
  // Les derniers arrêts consultés ne sont plus affichés : seuls les favoris restent à l'accueil
  $("recents").innerHTML = "";

// ===================== Réponse à voix haute =====================
function parler(arret, lignesAff) {
  if (!window.speechSynthesis) return;
  const maintenant = new Date();
  const dire = p => {
    const min = Math.floor((p.h - maintenant) / 60000);
    const heure = `${p.h.getHours()} heures ${String(p.h.getMinutes()).padStart(2, "0")}`;
    if (p.h.toDateString() !== maintenant.toDateString()) return `demain à ${heure}`;
    if (min <= 0) return "à l'approche";
    return min < 60 ? `dans ${min} minute${min > 1 ? "s" : ""}` : `à ${heure}`;
  };
  const phrases = lignesAff.slice(0, 4).map(([cle, choix]) => {
    const sens = cle.split("|")[2], p0 = choix[0];
    let t = `${p0.nomMode || "Ligne"} ${(p0.code ?? p0.ligne).split("").join(" ")} vers ${titre(sens).replace(/›/g, ",")} : ${dire(choix[0])}`;
    if (choix[1]) t += `, puis ${dire(choix[1])}`;
    return t + ".";
  });
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(`${titre(arret)}. ${phrases.join(" ")}`);
  u.lang = "fr-FR"; u.rate = 1.05;
  speechSynthesis.speak(u);
}

// ===================== Perturbations =====================
const sansBalises = t => t.replace(/<br\s*\/?>/gi, "\n").replace(/<[^>]+>/g, "").replace(/&nbsp;/g, " ").replace(/\u200b/g, " ").trim();
const echapper = t => t.replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
// Messages Ilevia parfois mal remplis à la source : « Ce , à partir de - en raison… » (date et heure vides),
// phrases collées (« desservis.Vous », « St PhilibertLe Bois »). On retire les trous et on remet les espaces.
function nettoyerMessage(t) {
  t = t.replace(/^\s*(Ce|Le|Du|Depuis le)\s*,\s*/i, "")
       .replace(/\s*à partir de\s*[-–]\s*/gi, " ")
       .replace(/\s*jusqu['’]\s*(au|à)\s*[-–,.]\s*/gi, " ")
       .replace(/^(Actuellement)\s*-\s*/i, "$1, ")
       .replace(/(?<!\b[A-Z])([.:;!?])(?=[A-ZÀ-ÖØ-Ý►])/g, "$1 ")
       .replace(/([a-zà-ÿ])(?=[A-ZÀ-ÖØ-Ý][a-zà-ÿ])/g, "$1. ")
       .replace(/\s{2,}/g, " ").trim();
  return t.charAt(0).toUpperCase() + t.slice(1);
}
// Ilevia laisse ses messages d'incident 24 h ; ses heures finissent par « Z » mais sont à l'heure de Paris.
// Fin réelle : l'heure écrite dans le message (« jusque 15h 50 ») + 30 min ; sans heure, 3 h après le message.
function perimeIlevia(x) {
  const n = new Date(), maintenant = Date.UTC(n.getFullYear(), n.getMonth(), n.getDate(), n.getHours(), n.getMinutes());
  if (x.heure_fin_prevue && Date.parse(x.heure_fin_prevue) < maintenant) return true;
  const modif = Date.parse(x.date_modification || "");
  if (!modif || x.type_perturbation !== "Perturbation") return false;
  const h = sansBalises(x.message || "").match(/jusqu(?:e|'?\s?(?:à|a|’à))\s*(\d{1,2})\s*h\s*(\d{2})?/i);
  if (h) {
    let fin = Math.floor(modif / 86400000) * 86400000 + (+h[1] * 60 + +(h[2] || 0)) * 60000;
    if (fin < modif - 3600000) fin += 86400000;
    return maintenant > fin + 30 * 60000;
  }
  return maintenant > modif + 3 * 3600000;
}

      for (const f of data.features) {
        const p = f.properties;
        if (p.type_perturbation === "Perturbation" && !perimeIlevia(p) && (p.date_modification || "") > (recent[p.cible] || "")) recent[p.cible] = p.date_modification || "";
      }
      for (const f of data.features) {
        const p = f.properties;
        if (perimeIlevia(p)) continue;   // incident terminé (Ilevia laisse ses messages 24 h)
        if (p.type_perturbation === "Perturbation" && (p.date_modification || "") < recent[p.cible]) continue;
        // cible "ILEVIA:LineRef::14:LOC" ; le métro s'écrit ME1/ME2 dans ce flux, M1/M2 dans les horaires
        const code = (p.cible || "").split("::")[1]?.split(":")[0]?.replace(/^ME(\d)$/, "M$1");
        if (code && base.has(code)) msgs.push({ lignes: [code], texte: nettoyerMessage(sansBalises(p.message || "")) });
      }
    }
  } catch { return; }
  if (!msgs.length || !$("trafic")) return;
  $("trafic").innerHTML = `<div class="arret trafic"><h2>⚠️ Info trafic</h2>` + msgs.map(m =>
    `<details><summary><b>${m.lignes.map(l => l.replace(/^M(\d)$/, "Métro $1")).join(", ")}</b> · ${echapper(m.texte.slice(0, 70))}${m.texte.length > 70 ? "…" : ""}</summary><p>${echapper(m.texte).replace(/\s*►/g, "<br>►")}</p></details>`
  ).join("") + `</div>`;
}

// ===================== Itinéraire à pied vers un arrêt (ouvre l'appli de cartes du téléphone) =====================
// Position d'un arrêt dans une liste [id, …, lat, lon] ; le plus proche de toi si plusieurs quais
function positionDe(liste, ids, col) {
  const pts = (liste || []).filter(a => ids.includes(a[0])).map(a => [a[col], a[col + 1]]);
  if (!pts.length) return null;
  return POSITION ? pts.sort((x, y) => distance(...POSITION, ...x) - distance(...POSITION, ...y))[0] : pts[0];
}
const SUR_IPHONE = /iPhone|iPad|iPod/.test(navigator.userAgent);
const PICTO_ITINERAIRE = `<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 2.5 21.5 12 12 21.5 2.5 12Z"/><path d="M9.5 15v-2.5a2 2 0 0 1 2-2H15"/><path d="M13 8.5l2 2-2 2"/></svg>`;
function boutonItineraire(position, nom) {
  if (!position) return "";
  const [la, lo] = position;
  const url = SUR_IPHONE ? `https://maps.apple.com/?daddr=${la},${lo}&dirflg=w`
                         : `https://www.google.com/maps/dir/?api=1&destination=${la},${lo}&travelmode=walking`;

}

// ===================== Autour de moi =====================
// Sans commune dans les données : on situe un arrêt par son voisin le plus proche (« près de Mairie »)
function voisinDe(liste, a, b, nom) {
  const v = liste.filter(x => x[1] !== nom).sort((x, y) => distance(a, b, x[3], x[4]) - distance(a, b, y[3], y[4]))[0];
  return v ? (/^[AEIOUYH]/.test(normaliser(v[1])) ? "près d'" : "près de ") + titre(v[1]) : "";
}
const distance = (a, b, c, d) => { // mètres entre deux points GPS
  const R = 6371000, r = x => x * Math.PI / 180;
  const h = Math.sin(r(c - a) / 2) ** 2 + Math.cos(r(a)) * Math.cos(r(c)) * Math.sin(r(d - b) / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(h));
};
let ARRETS_LILLE = null, ARRETS_PARIS = null;
const ARRETS_GTFS = {};
async function autourDeMoi() {
  if (!navigator.geolocation) { $("statut").textContent = "Localisation non disponible sur ce téléphone."; return; }
  $("statut").textContent = "📍 Je cherche où tu es…"; $("resultats").innerHTML = ""; $("proches").innerHTML = "";
  navigator.geolocation.getCurrentPosition(async pos => {
    const { latitude: la, longitude: lo } = pos.coords;
    POSITION = [la, lo];
    // Tu es dans une autre ville que celle choisie ? On bascule automatiquement
    const ici = villeProche(la, lo);
    if (ici) { VILLE_GPS = ici; if (ici !== VILLE) { choisirVille(ici); toast(`📍 Ville détectée : ${VILLES.find(v => v.id === ici).nom}`); } else construireBarre(); }
    let proches = [];
    try {
      if (VILLE === "PARIS") {
        // Liste des arrêts d'Île-de-France (régénérée chaque nuit) : calcul des plus proches sur le téléphone
        ARRETS_PARIS ??= await (await fetch("horaires/arrets_paris.json")).json();
        proches = ARRETS_PARIS.map(([num, label, a, b]) => ({ nom: label, m: distance(la, lo, a, b), pos: [a, b],
            force: { zone: { id: `stop_area:IDFM:${num}`, name: sansCommune(label), label } } }))
          .sort((x, y) => x.m - y.m).slice(0, 5);
      } else if (villeActuelle().gtfs) {
        const conf = villeActuelle();
        ARRETS_GTFS[conf.id] ??= await (await fetch(`horaires/${conf.gtfs}/arrets.json`)).json();
        // Un même arrêt peut être découpé en plusieurs groupes de quais : on les réunit (même nom, à moins de 500 m)
        const tous = ARRETS_GTFS[conf.id].map(([id, nom, commune, a, b]) => ({ id, nom, commune, a, b, m: distance(la, lo, a, b) }))
          .sort((x, y) => x.m - y.m);
        const vus = new Set();
        for (const p of tous) {
          if (vus.has(p.nom)) continue;
          vus.add(p.nom);
          const ids = tous.filter(q => q.nom === p.nom && distance(p.a, p.b, q.a, q.b) < 500).map(q => q.id);
          proches.push({ nom: p.nom, m: p.m, pos: [p.a, p.b], force: { nom: p.nom, ids, commune: p.commune } });
          if (proches.length === 5) break;
        }
      } else {
        ARRETS_LILLE ??= await (await fetch("horaires/lille/arrets.json")).json();
        proches = ARRETS_LILLE.map(([id, nom, commune, a, b]) => ({ nom, m: distance(la, lo, a, b), pos: [a, b], force: { nom, id, commune } }))
          .sort((x, y) => x.m - y.m).slice(0, 5);
      }
    } catch { $("statut").textContent = "Impossible de trouver les arrêts proches."; return; }
    if (!proches.length || proches[0].m > 3000) { $("statut").textContent = `Aucun arrêt ${VILLE === "PARIS" ? "parisien" : "Ilevia"} près de toi.`; return; }
    $("proches").innerHTML = "";
    for (const p of proches) {
      const groupe = document.createElement("span");
      groupe.className = "proche";
      const b = document.createElement("button");
      b.textContent = `📍 ${titre(p.nom)} · ${Math.round(p.m)} m`;
      b.onclick = () => { $("question").value = titre(p.nom); chercher(p.nom, { force: p.force }); };
      groupe.appendChild(b);
      groupe.insertAdjacentHTML("beforeend", boutonItineraire(p.pos, p.nom));
      $("proches").appendChild(groupe);
    }
    $("question").value = titre(proches[0].nom);
    chercher(proches[0].nom, { force: proches[0].force });
  }, err => {
    $("statut").textContent = err.code === 1 ? "Autorise la localisation pour cette page." : "Position introuvable, réessaie dehors.";
  }, { enableHighAccuracy: true, timeout: 15000, maximumAge: 60000 });
}
