<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#d6001c">
<title>Mon bus</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icone-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%23d6001c'/%3E%3Ctext x='50' y='70' font-size='60' text-anchor='middle'%3E🚌%3C/text%3E%3C/svg%3E">
<style>
  :root { --rouge:#d6001c; --fond:#f5f5f7; --texte:#1c1c1e; --gris:#6e6e73; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:system-ui,-apple-system,Roboto,sans-serif; background:var(--fond); color:var(--texte); }
  header { background:var(--rouge); color:#fff; padding:18px 20px; font-size:20px; font-weight:700; }
  main { padding:16px; max-width:520px; margin:0 auto; }
  form { display:flex; gap:8px; }
  input { flex:1; font-size:17px; padding:14px; border:1px solid #ccc; border-radius:12px; }
  button { font-size:17px; border:0; border-radius:12px; padding:0 18px; background:var(--texte); color:#fff; }
  #micro { width:100%; margin-top:14px; padding:22px; font-size:19px; font-weight:600; background:var(--rouge);
           user-select:none; -webkit-user-select:none; touch-action:none; }
  #micro.ecoute { background:#1a7f37; }
  .aide { color:var(--gris); font-size:14px; margin:10px 2px; }
  #recents { display:flex; flex-wrap:wrap; gap:8px; margin:12px 0; }
  #recents button { background:#fff; color:var(--texte); border:1px solid #ddd; padding:8px 12px; font-size:14px; }
  .arret { background:#fff; border-radius:14px; padding:14px 16px; margin-top:14px; box-shadow:0 1px 3px rgba(0,0,0,.08); }
  .arret h2 { margin:0 0 8px; font-size:16px; }
  .ligne { display:flex; align-items:center; gap:10px; padding:8px 0; border-top:1px solid #eee; }
  .num { min-width:52px; text-align:center; font-weight:800; font-size:17px; color:#fff; background:var(--texte); border-radius:8px; padding:3px 6px; line-height:1.1; }
  .num small { display:block; font-size:10px; font-weight:600; text-transform:uppercase; letter-spacing:.3px; opacity:.9; }
  .sens { flex:1; font-size:15px; }
  .min { font-weight:700; font-size:17px; white-space:nowrap; }
  .min small { display:block; font-weight:400; font-size:12px; color:var(--gris); text-align:right; }
  #statut { margin-top:12px; color:var(--gris); }
  .prevu { color:var(--gris); font-weight:600; }
  .prevu i { font-weight:400; font-size:12px; }
  .retard { color:#c2410c; font-size:13px; }
  .sources { margin-top:28px; font-size:12px; text-align:center; }
  .sources a { color:var(--gris); }
  .supprime { color:#b91c1c; text-decoration:line-through; }
  #villes { display:flex; gap:8px; margin:0 -16px 12px; padding:2px 16px 6px; overflow-x:auto; scroll-snap-type:x proximity;
            -webkit-overflow-scrolling:touch; scrollbar-width:none; }
  #villes::-webkit-scrollbar { display:none; }
  #villes button { flex:0 0 auto; min-width:104px; padding:12px 16px; font-weight:700; background:#fff; color:var(--texte);
                   border:2px solid #ddd; scroll-snap-align:start; }
  #villes button:disabled { color:#aaa; border-style:dashed; }
  #villes button small { display:block; font-size:10px; font-weight:500; }
  #toast { position:fixed; left:50%; bottom:24px; transform:translateX(-50%); background:var(--texte); color:#fff;
           padding:10px 16px; border-radius:20px; font-size:14px; opacity:0; transition:opacity .3s; pointer-events:none; z-index:9; }
  #toast.visible { opacity:1; }
  #gps { width:100%; padding:13px; margin-bottom:12px; background:#fff; color:var(--texte); border:2px solid var(--texte); font-weight:700; }
  #proches { display:flex; flex-wrap:wrap; gap:8px; margin:-4px 0 12px; }
  #proches button { background:#eef6ff; color:var(--texte); border:1px solid #bcd7f5; padding:8px 12px; font-size:14px; }
  #favoris { display:flex; flex-direction:column; gap:8px; margin-top:12px; }
  .favori { display:flex; gap:6px; }
  .favori button:first-child { flex:1; text-align:left; padding:14px; background:#fff8d6; color:var(--texte); border:2px solid #f2c94c; font-weight:700; }
  .favori .retirer { background:#fff; color:var(--gris); border:1px solid #ddd; padding:0 14px; }
  .actions { display:flex; gap:8px; margin-top:10px; border-top:1px solid #eee; padding-top:10px; }
  .actions button { flex:1; padding:10px; font-size:14px; background:#f2f2f4; color:var(--texte); }
  .trafic h2 { color:#b45309; }
  .trafic details { border-top:1px solid #eee; padding:8px 0; font-size:14px; }
  .trafic summary { cursor:pointer; }
  .trafic p { white-space:pre-line; margin:8px 0 0; color:#333; }
  #villes button.actif { background:var(--texte); color:#fff; border-color:var(--texte); }
</style>
</head>
<body>
<header>🚌 Mon bus</header>
<main>
  <div id="villes"></div>
  <div id="toast"></div>
  <button id="gps">📍 Autour de moi</button>
  <div id="proches"></div>
  <form id="formulaire">
    <input id="question" placeholder="ex : 14 C1 République Beaux-Arts" autocomplete="off">
    <button>OK</button>
  </form>
  <button id="micro">🎤 Reste appuyé pour parler</button>
  <p class="aide" id="aideVille"></p>
  <div id="favoris"></div>
  <div id="recents"></div>
  <div id="statut"></div>
  <div id="resultats"></div>
  <p class="aide sources">Données : <a href="https://data.lillemetropole.fr">Ilevia / Métropole Européenne de Lille</a> ·
    <a href="https://transport.data.gouv.fr/datasets/horaires-sncf">SNCF Voyageurs</a> (ODbL) ·
    <a href="https://prim.iledefrance-mobilites.fr">Île-de-France Mobilités – PRIM</a>.
    Horaires mis à jour chaque nuit, temps réel en direct.</p>
</main>
<script>
const WFS = "https://data.lillemetropole.fr/geoserver/wfs";
const $ = id => document.getElementById(id);

// Mots à ignorer dans la question
const VIDES = new Set("LE LA LES ET OU A AU AUX DE DU DES D L UN UNE BUS TRAM LIGNE LIGNES DANS COMBIEN TEMPS PASSE PASSENT QUAND PROCHAIN PROCHAINS PROCHAINE ARRET ARRIVE ARRIVENT EST CE QUE QUI QUEL QUELLE QUELS HEURE HEURES MINUTES DIS MOI VERS DIRECTION SVP STP PASSAGE PASSAGES".split(" "));
const CHIFFRES = { UN:"1", DEUX:"2", TROIS:"3", QUATRE:"4", CINQ:"5", SIX:"6", SEPT:"7", HUIT:"8", NEUF:"9", DIX:"10" };

function normaliser(t) {
  return t.normalize("NFD").replace(/[̀-ͯ]/g, "").toUpperCase()
          .replace(/[-'’.,?!]/g, " ").replace(/\s+/g, " ").trim();
}

// Sépare la question en lignes (14, CO1, L1...) et en nom d'arrêt
function analyser(question) {
  let mots = normaliser(question).split(" ").filter(Boolean);
  // Recolle "CO 1", "C O 1", "LIANE 1", "L 1" -> C1 / L1
  const res = [];
  for (let i = 0; i < mots.length; i++) {
    let m = mots[i], suivant = mots[i + 1], apres = mots[i + 2];
    const chiffre = s => s && (/^\d+$/.test(s) ? s : CHIFFRES[s]);
    // Lille : CO = Corolle (CO1, CO2…), C = Citadine (C1, C1A, C1B…)
    if ((m === "CO" || m === "COROLLE") && chiffre(suivant)) { res.push("CO" + chiffre(suivant)); i++; continue; }
    if (m === "CITADINE" && chiffre(suivant)) { res.push("C" + chiffre(suivant)); i++; continue; }
    if (m === "C" && suivant === "O" && chiffre(apres)) { res.push("CO" + chiffre(apres)); i += 2; continue; }
    if ((m === "LIANE" || m === "L") && chiffre(suivant)) { res.push("L" + chiffre(suivant)); i++; continue; }
    if (m === "C" && chiffre(suivant)) { res.push("C" + chiffre(suivant)); i++; continue; }
    // Mode précisé : « métro 1 », « bus 14 », « RER A », « tram 3a », « transilien H », « TER »…
    // -> filtre "MODE:CODE" (CODE = * si aucun numéro : « le métro à Gare Lille Flandres »)
    const code = x => x && (chiffre(x) || (/^[A-Z]{0,4}\d{1,3}[AB]?$/.test(x) ? x : null));
    if (m === "RER" && /^[A-E]$/.test(suivant || "")) { res.push("#RER:" + suivant); i++; continue; }
    if (m === "METRO" || m === "M") { if (chiffre(suivant)) { res.push("#METRO:" + chiffre(suivant)); i++; } else if (m === "METRO") res.push("#METRO:*"); else res.push(m); continue; }
    if (m === "TRAM" || m === "TRAMWAY") { if (code(suivant)) { res.push("#TRAM:T" + code(suivant).replace(/^T/, "")); i++; } else res.push("#TRAM:*"); continue; }
    if (m === "BUS" || m === "NOCTILIEN") { if (code(suivant)) { res.push("#BUS:" + code(suivant)); i++; } else res.push("#BUS:*"); continue; }
    if (m === "TRANSILIEN" || m === "TRAIN") { if (/^[A-Z]$/.test(suivant || "") && suivant !== "A") { res.push("#TRAIN:" + suivant); i++; } else res.push("#TRAIN:*"); continue; }
    if (m === "TER") { res.push("#TRAIN:*"); continue; }
    res.push(m);
  }
  const lignes = [], arret = [];
  for (const m of res) {
    if (m.startsWith("#")) lignes.push(m.slice(1));
    else if (/^M\d{1,2}$/.test(m)) lignes.push("METRO:" + m.slice(1));
    else if (/^\d{1,3}$/.test(m) || /^[A-Z]{1,4}\d{1,3}[AB]?$/.test(m)) lignes.push("*:" + m);
    else if (!VIDES.has(m)) arret.push(m);
  }
  return { lignes, arret };
}

// Une ligne affichée correspond-elle au filtre "MODE:CODE" ?
// "C1" garde C1A et C1B ; à Lille le métro s'appelle M1/M2 dans les données
function correspond(it, filtre) {
  const [mode, code] = filtre.split(":");
  if (mode !== "*" && it.mode !== mode) return false;
  if (code === "*") return true;
  const c = (it.ligne || "").toUpperCase();
  return [c, c.replace(/[AB]$/, ""), c.replace(/^M(?=\d)/, "")].includes(code);
}

// Citadine C1 : le flux affiche "Porte des Postes" dans les deux sens.
// On retrouve le sens grâce au quai (code d'arrêt physique), relevé dans le flux temps réel.
// Boucle A : Porte des Postes -> Cormontaigne -> ... -> CHU -> Porte des Postes
// Boucle B : Porte des Postes -> CHU -> ... -> Cormontaigne -> Porte des Postes
const BOUCLES = {
  C1: {
    A: "PDP004 LBM001 RLE001 ISL002 LFU002 COR002 LCB001 CHQ002 SAC002 NAT003 REP005 ARJ003 RTA001 RUW001 ARA003 PRR003 FBG004 RDL001 TIM003 GEY001 LCI001 ARB001 GID001 CAL002 LBE002 CAV002 TSS002 SIM002".split(" "),
    B: "PDP012 SIM003 TSS001 CAV001 LBE001 CAL001 GID002 ARB002 LCI002 GEY002 TIM004 RDL002 FBG005 PRR002 ARA004 RUW002 RTA002 ARJ005 REP003 NAT004 SAC001 CHQ001 LCB003 COR001 LFU001 ISL001 RLE002 LBM002".split(" "),
    sens: { A: "Cormontaigne › CHU › Porte des Postes", B: "CHU › Cormontaigne › Porte des Postes" }
  }
};
function preciserBoucle(p) {
  const b = BOUCLES[p.code_ligne];
  if (!b) return p;
  for (const cote of ["A", "B"]) {
    if (b[cote].includes(p.code_arret_physique)) return { ...p, code_ligne: p.code_ligne + cote, sens_ligne: b.sens[cote] };
  }
  return p;
}

// --- Horaires théoriques (fichiers régénérés chaque nuit par GitHub Actions) ---
// INDEX : nom -> identifiants d'arrêts (un par commune) · QUAIS : identifiant -> codes de quais
let INDEX = null, QUAIS = {}, LIGNES_LILLE = {};
const CACHE = {};
async function chargerIndex() {
  if (INDEX) return INDEX;
  try { const d = await (await fetch("horaires/stations.json")).json(); INDEX = d.stations; QUAIS = d.quais || {}; LIGNES_LILLE = d.lignes || {}; }
  catch { INDEX = {}; }
  return INDEX;
}
async function chargerHoraires(id) {
  if (!CACHE[id]) {
    try { const r = await fetch(`horaires/${id}.json`); CACHE[id] = r.ok ? (await r.json()).passages : []; }
    catch { CACHE[id] = []; }
  }
  return CACHE[id];
}

// Temps réel : passages Ilevia d'un arrêt (le flux ne donne que 1 ou 2 bus par ligne).
// On cherche par code de quai (ex. REP003) car le nom peut différer (« LILLE PORTE DE DOUAI » vs « Porte de Douai »).
async function chargerTempsReel(nomArret, quais) {
  if (quais && quais.length) {
    const params = new URLSearchParams({
      service: "WFS", version: "2.0.0", request: "GetFeature",
      typeNames: "dsp_ilevia:prochains_passages", outputFormat: "application/json",
      CQL_FILTER: `code_arret_physique IN (${quais.map(q => `'${q.replace(/[^A-Z0-9]/g, "")}'`).join(",")})`
    });
    return (await (await fetch(`${WFS}?${params}`)).json()).features.map(f => f.properties);
  }
  const mots = nomArret.split(" ").filter(m => m.length >= 2).map(m => m.replace(/'/g, ""));
  const params = new URLSearchParams({
    service: "WFS", version: "2.0.0", request: "GetFeature",
    typeNames: "dsp_ilevia:prochains_passages", outputFormat: "application/json",
    CQL_FILTER: mots.map(m => `nom_station ILIKE '%${m}%'`).join(" AND ")
  });
  const data = await (await fetch(`${WFS}?${params}`)).json();
  return data.features.map(f => f.properties).filter(p => normaliser(p.nom_station) === nomArret);
}

// ===================== Choix de la ville =====================
// Villes : « dispo » = données branchées. Les autres s'affichent « bientôt » dans la barre.
// Pour en ajouter une : brancher ses données puis passer dispo à true.
const VILLES = [
  { id: "LILLE", nom: "Lille", centre: [50.63, 3.06], dispo: true },
  { id: "PARIS", nom: "Paris", centre: [48.86, 2.35], dispo: true },
  { id: "LYON", nom: "Lyon", centre: [45.76, 4.84] },
  { id: "MARSEILLE", nom: "Marseille", centre: [43.30, 5.37] },
  { id: "TOULOUSE", nom: "Toulouse", centre: [43.60, 1.44] },
  { id: "BORDEAUX", nom: "Bordeaux", centre: [44.84, -0.58] },
  { id: "NANTES", nom: "Nantes", centre: [47.22, -1.55] },
  { id: "STRASBOURG", nom: "Strasbourg", centre: [48.58, 7.75] },
  { id: "MONTPELLIER", nom: "Montpellier", centre: [43.61, 3.88] },
  { id: "RENNES", nom: "Rennes", centre: [48.11, -1.68] },
  { id: "NICE", nom: "Nice", centre: [43.70, 7.27] },
  { id: "GRENOBLE", nom: "Grenoble", centre: [45.19, 5.72] },
  { id: "SAINT-ETIENNE", nom: "Saint-Étienne", centre: [45.44, 4.39] },
  { id: "BREST", nom: "Brest", centre: [48.39, -4.49] },
  { id: "AMIENS", nom: "Amiens", centre: [49.89, 2.30] }
];
let VILLE_GPS = null;
function toast(t) { const e = $("toast"); e.textContent = t; e.classList.add("visible"); setTimeout(() => e.classList.remove("visible"), 2500); }
// Barre coulissante : ville détectée par GPS en premier, puis ta ville choisie, puis les autres dispo, puis « bientôt »
function construireBarre() {
  const rang = v => (v.id === VILLE_GPS ? 0 : v.id === VILLE ? 1 : v.dispo ? 2 : 3);
  const liste = [...VILLES].sort((a, b) => rang(a) - rang(b));
  $("villes").innerHTML = "";
  for (const v of liste) {
    const b = document.createElement("button");
    b.dataset.ville = v.id;
    b.innerHTML = v.nom.toUpperCase() + (v.id === VILLE_GPS ? "<small>📍 tu es ici</small>" : v.dispo ? "" : "<small>bientôt</small>");
    b.disabled = !v.dispo;
    b.classList.toggle("actif", v.id === VILLE);
    b.onclick = () => choisirVille(v.id);
    $("villes").appendChild(b);
  }
  $("villes").scrollLeft = 0;
}
// Ville disponible la plus proche d'une position (à moins de 60 km), sinon null
function villeProche(la, lo) {
  const d = VILLES.filter(v => v.dispo).map(v => ({ v, km: distance(la, lo, ...v.centre) / 1000 })).sort((a, b) => a.km - b.km)[0];
  return d && d.km < 60 ? d.v.id : null;
}
let VILLE = "LILLE";
try { VILLE = localStorage.getItem("ville") || "LILLE"; } catch {}
const AIDES = {
  LILLE: "Dis les lignes puis l'arrêt : « le 14 et la C1 à République Beaux-Arts ». Sans ligne, tout s'affiche.",
  PARIS: "Dis les lignes puis l'arrêt : « métro 4 et RER A à Châtelet ». Sans ligne, tout s'affiche."
};
const EXEMPLES = { LILLE: "ex : 14 C1 République Beaux-Arts", PARIS: "ex : métro 4 RER A Châtelet" };
function choisirVille(v) {
  VILLE = v;
  try { localStorage.setItem("ville", v); } catch {}
  construireBarre();
  $("aideVille").textContent = AIDES[v];
  $("question").placeholder = EXEMPLES[v];
  $("resultats").innerHTML = ""; $("statut").textContent = ""; $("proches").innerHTML = "";
  DERNIERE = null;
  montrerRecents();
}

$("gps").onclick = () => autourDeMoi();

// Un nom d'arrêt « colle » à la question si tous ses mots utiles (hors le, de, la…) y sont
const motsUtiles = nom => nom.split(" ").filter(m => !VIDES.has(m));
// Deux mots « pareils » malgré une faute de frappe ou un pluriel (FLANDRE / FLANDRES, REPUBLIQE / REPUBLIQUE)
function proche(a, b) {
  if (a === b) return true;
  if (Math.min(a.length, b.length) >= 3 && (a + "S" === b || b + "S" === a || a + "X" === b || b + "X" === a)) return true;
  if (a.length < 4 || b.length < 4) return false;
  if (Math.abs(a.length - b.length) > 1 || Math.min(a.length, b.length) < 5) return false;
  let i = 0, j = 0, diff = 0;          // au plus une lettre différente (en trop, en moins ou changée)
  while (i < a.length && j < b.length) {
    if (a[i] === b[j]) { i++; j++; continue; }
    if (++diff > 1) return false;
    if (a.length > b.length) i++; else if (b.length > a.length) j++; else { i++; j++; }
  }
  return diff + (a.length - i) + (b.length - j) <= 1;
}
// Choix de l'arrêt : celui dont tous les mots sont dans la question et qui en reprend le plus
// (« Gare Lille Flandre » -> GARE LILLE FLANDRES, et pas l'arrêt « GARE »)
function meilleurNom(noms, arret) {
  const score = n => {
    const nw = motsUtiles(n);
    const m = nw.filter(w => arret.some(q => proche(w, q))).length;
    const qm = arret.filter(q => nw.some(w => proche(w, q))).length;
    return { complet: nw.length > 0 && m === nw.length, m, qm, part: nw.length ? m / nw.length : 0, len: nw.length };
  };
  let best = null, bs = null;
  for (const n of noms) {
    const sc = score(n);
    if (!sc.m) continue;
    const mieux = !bs
      || (sc.complet && !bs.complet)
      || (sc.complet === bs.complet && (sc.qm > bs.qm
          || (sc.qm === bs.qm && (sc.part > bs.part || (sc.part === bs.part && sc.len > bs.len)))));
    if (mieux) { best = n; bs = sc; }
  }
  return best;
}

// Libellé d'une direction prévue : le sens temps réel qui lui ressemble le plus (sinon la direction elle-même)
function libelleur(items) {
  const sensConnus = {};
  for (const it of items) (sensConnus[it.ligne] ??= new Set()).add(it.sens);
  return (ligne, direction) => {
    const mots = normaliser(direction).split(" ");
    let best = null, bestScore = 0, egalite = false;
    for (const s of sensConnus[ligne] || []) {
      // Part des mots du sens temps réel retrouvés (CHATEAU -> 1/1 bat WAMBRECHIES AGRIPPIN -> 1/2)
      const sc = s.split(" ").filter(m => mots.includes(m)).length / s.split(" ").length;
      if (sc > bestScore) { best = s; bestScore = sc; egalite = false; }
      else if (sc === bestScore && sc > 0) egalite = true;
    }
    return best && !egalite ? best : normaliser(direction);
  };
}

// ===================== Point d'entrée =====================
// opts.force : arrêt déjà connu (Autour de moi) · opts.silencieux : rafraîchissement auto · opts.voix : lire la réponse
let DERNIERE = null;
async function chercher(question, opts = {}) {
  question = question.trim();
  if (!question) return;
  const { lignes, arret } = analyser(question);
  if (!arret.length) { $("statut").textContent = "Je n'ai pas compris l'arrêt. " + EXEMPLES[VILLE]; return; }
  if (!opts.silencieux) { $("statut").textContent = "Recherche…"; $("resultats").innerHTML = ""; }
  let r;
  try { r = VILLE === "PARIS" ? await chercherParis(arret, opts.force) : await chercherLille(arret, opts.force); }
  catch (e) { if (!opts.silencieux) $("statut").textContent = "Problème de connexion. Réessaie dans un instant."; return; }
  if (!r) { $("statut").textContent = "Arrêt introuvable. Vérifie le nom."; return; }
  DERNIERE = { question, force: opts.force, ville: VILLE };

  // Filtres : lignes demandées ("C1" garde C1A et C1B), puis direction (mots restants de la phrase)
  const maintenant = new Date();
  let liste = r.items.filter(it => it.h >= new Date(maintenant.getTime() - 60000));
  if (lignes.length) liste = liste.filter(it => lignes.some(f => correspond(it, f)));
  const restants = arret.filter(m => !normaliser(r.nom).split(" ").includes(m));
  const avecSens = liste.filter(it => it.sens.split(" ").some(m => restants.includes(m)));
  if (avecSens.length) liste = avecSens;
  afficher(r, liste, question, opts);
}

// ===================== LILLE (Ilevia) =====================
// Mode et couleurs d'une ligne Ilevia (type GTFS : 0 tram, 1 métro, 3 bus)
function habillerLille(it) {
  const [type, couleur, texte] = LIGNES_LILLE[it.ligne.replace(/^(C\d+)[AB]$/, "$1")] || [3];
  const mode = type === 1 ? "METRO" : type === 0 ? "TRAM" : "BUS";
  return { ...it, mode, nomMode: { METRO: "Métro", TRAM: "Tram", BUS: "Bus" }[mode],
           code: mode === "METRO" ? it.ligne.replace(/^M/, "") : mode === "TRAM" ? "" : it.ligne, couleur, texte };
}
async function chercherLille(arret, force) {
  const index = await chargerIndex();
  const gares = await chargerGaresTer();
  const nomsGares = Object.fromEntries(gares.map(g => [normaliser(g[1]), g]));
  const nom = force?.nom || meilleurNom([...Object.keys(index), ...Object.keys(nomsGares)], arret) || arret.join(" ");
  let tempsReel = [], tempsReelOk = true;
  // Arrêt précis (Autour de moi) ou tous les arrêts de ce nom (ex. Wagner à Lille ET à Wattrelos)
  const ids = force?.id ? [force.id] : (index[nom] || []);
  const quais = ids.flatMap(id => QUAIS[id] || []);
  try { tempsReel = await chargerTempsReel(nom, quais); } catch { tempsReelOk = false; }
  const prevus = (await Promise.all(ids.map(chargerHoraires))).flat();

  const maintenant = new Date(), items = [];
  for (const p of tempsReel) {
    const q = preciserBoucle(p);
    // L'heure du flux finit par "Z" mais c'est déjà l'heure locale : on retire le Z
    items.push({ ligne: q.code_ligne, sens: normaliser(q.sens_ligne), h: new Date(p.heure_estimee_depart.replace("Z", "")), prevu: false });
  }
  const libelle = libelleur(items);
  const limite = maintenant.getTime() + 36 * 3600000;
  for (const [d, hm, ligne, direction, quai] of prevus) {
    const [H, M] = hm.split(":").map(Number);
    const h = new Date(+d.slice(0, 4), +d.slice(4, 6) - 1, +d.slice(6, 8), H, M); // 25:10 = lendemain 01:10
    if (h < maintenant || h > limite) continue;
    const q = preciserBoucle({ code_ligne: ligne, code_arret_physique: quai, sens_ligne: direction });
    items.push({ ligne: q.code_ligne, sens: q.code_ligne !== ligne ? normaliser(q.sens_ligne) : libelle(ligne, direction), h, prevu: true });
  }
  for (let i = 0; i < items.length; i++) items[i] = habillerLille(items[i]);

  // TER : la gare portant ce nom, ou les gares à moins de 500 m de l'arrêt choisi
  let garesProches = nomsGares[nom] ? [nomsGares[nom]] : [];
  if (!garesProches.length && ids.length) {
    ARRETS_LILLE ??= await (await fetch("horaires/arrets.json")).json().catch(() => []);
    const pos = ARRETS_LILLE.filter(a => ids.includes(a[0]));
    garesProches = gares.filter(g => pos.some(a => distance(a[3], a[4], g[2], g[3]) < 500));
  }
  if (garesProches.length) items.push(...await trainsTer(garesProches, maintenant, limite, nom));
  const titreArret = force?.commune && (index[nom] || []).length > 1 ? `${nom} (${force.commune})` : nom;
  return { nom, titre: titreArret, items, tempsReelOk };
}

// ===================== TER (SNCF) dans la métropole lilloise =====================
let GARES_TER = null;
const CACHE_TER = {};
async function chargerGaresTer() {
  if (!GARES_TER) {
    try { GARES_TER = await (await fetch("horaires/ter/gares.json")).json(); } catch { GARES_TER = []; }
  }
  return GARES_TER;
}

// Lecture minimale du format protobuf (GTFS-RT) : pas de bibliothèque à charger
function lireProto(buf, debut = 0, fin = buf.length) {
  const champs = [];
  let i = debut;
  const varint = () => { let r = 0n, d = 0n, o; do { o = buf[i++]; r |= BigInt(o & 127) << d; d += 7n; } while (o & 128); return r; };
  while (i < fin) {
    const cle = Number(varint()), num = cle >> 3, type = cle & 7;
    if (type === 0) champs.push([num, varint()]);
    else if (type === 2) { const n = Number(varint()); champs.push([num, [i, i + n]]); i += n; }
    else if (type === 1) i += 8;
    else if (type === 5) i += 4;
    else break;
  }
  return champs;
}
const texteProto = (buf, [a, b]) => new TextDecoder().decode(buf.subarray(a, b));
const entier = v => { const n = BigInt.asIntN(64, v); return Number(n); };

// Retards et suppressions SNCF : flux national léger (seuls les trains perturbés y figurent).
// Relu au plus une fois par minute. Clé : n° de train + date -> { supprime, gares: { UIC: { retard, supprime } } }
let RT_SNCF = { t: 0, data: null };
async function retardsSncf() {
  if (RT_SNCF.data && Date.now() - RT_SNCF.t < 60000) return RT_SNCF.data;
  const buf = new Uint8Array(await (await fetch("https://proxy.transport.data.gouv.fr/resource/sncf-gtfs-rt-trip-updates")).arrayBuffer());
  const data = {};
  for (const [n, ent] of lireProto(buf)) {
    if (n !== 2) continue;
    for (const [m, tu] of lireProto(buf, ...ent)) {
      if (m !== 3) continue;
      let tripId = "", date = "", supprime = false;
      const gares = {};
      for (const [k, v] of lireProto(buf, ...tu)) {
        if (k === 1) for (const [x, y] of lireProto(buf, ...v)) {
          if (x === 1) tripId = texteProto(buf, y);
          if (x === 3) date = texteProto(buf, y);
          if (x === 4 && y === 3n) supprime = true;          // CANCELED
        }
        if (k === 2) {
          let stop = "", retard = null, saute = false;
          for (const [x, y] of lireProto(buf, ...v)) {
            if ((x === 2 || x === 3) && Array.isArray(y)) for (const [a, b] of lireProto(buf, ...y)) if (a === 1 && (x === 3 || retard === null)) retard = entier(b);
            if (x === 4) stop = texteProto(buf, y);
            if (x === 5 && y === 1n) saute = true;             // SKIPPED
          }
          const uic = stop.split("-").pop();
          if (uic) gares[uic] = { retard, supprime: saute };
        }
      }
      const numero = (tripId.match(/OCESN(\d+)[A-Z]/) || [])[1];
      if (!numero) continue;
      // Un même train peut apparaître plusieurs fois : on fusionne les informations
      const cle = `${numero}|${date || (tripId.match(/:(\d{8})(?::\d+)?$/) || [])[1]}`;
      const deja = data[cle];
      data[cle] = deja ? { supprime: deja.supprime || supprime, gares: { ...deja.gares, ...gares } } : { supprime, gares };
    }
  }
  RT_SNCF = { t: Date.now(), data };
  return data;
}

async function trainsTer(gares, maintenant, limite, nomArret = "") {
  let rt = {};
  try { rt = await retardsSncf(); } catch {}
  const items = [];
  for (const [uic, nomGare] of gares) {
    if (!CACHE_TER[uic]) { try { CACHE_TER[uic] = await (await fetch(`horaires/ter/${uic}.json`)).json(); } catch { CACHE_TER[uic] = []; } }
    for (const [d, hm, ligne, destination, numero, couleur, texte] of CACHE_TER[uic]) {
      const [H, M] = hm.split(":").map(Number);
      const prevue = new Date(+d.slice(0, 4), +d.slice(4, 6) - 1, +d.slice(6, 8), H, M);
      const info = rt[`${numero}|${d}`];
      const g = info?.gares?.[uic];
      const retard = g?.retard ? Math.round(g.retard / 60) : 0;
      const h = new Date(prevue.getTime() + retard * 60000);
      if (h < new Date(maintenant.getTime() - 60000) || prevue > limite) continue;
      items.push({ ligne, code: ligne, mode: "TRAIN", nomMode: "TER", sens: normaliser(destination) + (gares.length > 1 && !normaliser(nomGare).split(" ").every(m => nomArret.split(" ").includes(m)) ? ` (DEPUIS ${normaliser(nomGare)})` : ""), h, couleur, texte,
                   prevu: !info, retard, supprime: !!(info?.supprime || g?.supprime), independant: true,
                   });
    }
  }
  return items;
}

// ===================== PARIS (Île-de-France Mobilités / PRIM) =====================
// Clé PRIM gratuite (compte de Nice). Elle est visible ici : si elle est abusée, en régénérer une sur PRIM.
const PRIM = "https://prim.iledefrance-mobilites.fr/marketplace";
const CLE_PRIM = "4nXb9R6YGCqMyntuh0GmKY3U8xtlSk27";
const prim = async chemin => {
  const r = await fetch(PRIM + chemin, { headers: { apikey: CLE_PRIM } });
  if (!r.ok) throw new Error("PRIM " + r.status);
  return r.json();
};
const LIGNES_IDFM = {}; // C01371 -> { code, couleur, texte }
async function infoLigne(id) {
  if (!LIGNES_IDFM[id]) {
    try {
      const l = (await prim(`/v2/navitia/lines/line:IDFM:${id}`)).lines[0];
      LIGNES_IDFM[id] = { code: l.code, couleur: l.color, texte: l.text_color, nomMode: l.commercial_mode?.name, nomLigne: l.name };
    } catch { LIGNES_IDFM[id] = { code: id }; }
  }
  return LIGNES_IDFM[id];
}
// Heure Navitia "20261030T220700" (heure de Paris)
const dateNavitia = s => new Date(+s.slice(0, 4), +s.slice(4, 6) - 1, +s.slice(6, 8), +s.slice(9, 11), +s.slice(11, 13), +s.slice(13, 15));
// Mode d'une ligne d'Île-de-France d'après son nom commercial (Métro, RER, Bus, Tramway, Transilien, TER…)
function habillerParis(it, nomMode = "", nomLigne = "") {
  const n = normaliser(nomMode);
  // Bus de remplacement (travaux) : « Bus Remplacement RER D » -> badge « BUS RER » + D
  const remplacement = normaliser(nomLigne).match(/REMPLACEMENT (RER|TRANSILIEN|TRAM|METRO)/);
  if (remplacement) return { ...it, mode: "BUS", nomMode: "Bus " + { RER: "RER", TRANSILIEN: "Transilien", TRAM: "Tram", METRO: "Métro" }[remplacement[1]] };
  const mode = n.includes("METRO") ? "METRO" : n === "RER" ? "RER" : n.includes("TRAM") ? "TRAM"
             : /TRANSILIEN|TER|TRAIN/.test(n) ? "TRAIN" : "BUS";
  const nom = { METRO: "Métro", RER: "RER", TRAM: "Tram", BUS: n.includes("NOCTILIEN") ? "Noctilien" : "Bus" }[mode]
            || (n.includes("TRANSILIEN") ? "Transilien" : n.includes("TER") ? "TER" : "Train");
  // Pas de doublon « TER TER » : le code est vide s'il répète le nom du mode
  const code = normaliser(it.code || "") === normaliser(nom) ? "" : it.code;
  return { ...it, mode, nomMode: nom, code };
}
const sansCommune = s => s.replace(/\s*\(.*?\)\s*/g, " ").trim(); // "La Défense (Puteaux)" -> "La Défense"

async function chercherParis(arret, force) {
  const zone = force?.zone || await trouverZoneParis(arret);
  if (!zone) return null;
  const nom = normaliser(zone.name);
  const num = zone.id.split(":").pop();
  return chargerZoneParis(zone, nom, num);
}

// Arrêt parisien : on cherche la phrase entière puis chaque mot, et on garde le nom qui colle le mieux
async function trouverZoneParis(arret) {
  const requetes = [arret.join(" "), ...arret.filter(m => m.length >= 3)];
  const trouves = {};
  for (const res of await Promise.all(requetes.map(q =>
      prim(`/v2/navitia/places?q=${encodeURIComponent(q)}&type%5B%5D=stop_area&count=8`).catch(() => ({}))))) {
    for (const p of res.places || []) if (p.stop_area && !trouves[normaliser(p.stop_area.name)]) trouves[normaliser(p.stop_area.name)] = p.stop_area;
  }
  const nom = meilleurNom(Object.keys(trouves), arret);
  return nom ? trouves[nom] : null;
}

async function chargerZoneParis(zone, nom, num) {
  // Prévu (Navitia) et temps réel (SIRI) en parallèle
  const [dep, sm] = await Promise.all([
    prim(`/v2/navitia/stop_areas/${zone.id}/departures?count=150&data_freshness=base_schedule`).catch(() => ({ departures: [] })),
    prim(`/stop-monitoring?MonitoringRef=${encodeURIComponent(`STIF:StopArea:SP:${num}:`)}`).catch(() => null)
  ]);
  const items = [];
  for (const d of dep.departures || []) {
    const id = (d.route?.line?.id || "").split(":").pop();
    const di = d.display_informations;
    if (id) LIGNES_IDFM[id] ??= { code: di.code, couleur: di.color, texte: di.text_color, nomMode: di.commercial_mode, nomLigne: d.route?.line?.name };
  }
  const visites = sm?.Siri?.ServiceDelivery?.StopMonitoringDelivery?.[0]?.MonitoredStopVisit || [];
  for (const v of visites) {
    const j = v.MonitoredVehicleJourney, c = j.MonitoredCall || {};
    const t = c.ExpectedDepartureTime || c.ExpectedArrivalTime || c.AimedDepartureTime || c.AimedArrivalTime;
    const id = (j.LineRef?.value || "").split(":").filter(Boolean).pop();
    const dest = j.DestinationName?.[0]?.value || j.DirectionName?.[0]?.value || "";
    if (!t || !id) continue;
    const info = await infoLigne(id);
    items.push(habillerParis({ ligne: (info.code || id).toUpperCase(), code: info.code || id, sens: normaliser(dest), h: new Date(t), prevu: false,
                               couleur: info.couleur, texte: info.texte }, info.nomMode, info.nomLigne));
  }
  const libelle = libelleur(items);
  for (const d of dep.departures || []) {
    const di = d.display_informations;
    const code = (di.code || "").toUpperCase();
    items.push(habillerParis({ ligne: code, code: di.code || "", sens: libelle(code, sansCommune(di.direction || "")),
                 h: dateNavitia(d.stop_date_time.departure_date_time), prevu: true, couleur: di.color, texte: di.text_color }, di.commercial_mode, d.route?.line?.name));
  }
  return { nom, titre: zone.label || zone.name, items, tempsReelOk: !!sm, perturbationsParis: dep.disruptions || [] };
}

// Par ligne + direction : les bus en temps réel, complétés par les horaires prévus
// (seulement APRÈS le dernier bus en temps réel, pour ne pas compter deux fois le même bus)
function afficher(r, liste, question, opts) {
  const arret = r.titre, maintenant = new Date();
  if (!liste.length) { $("statut").textContent = "Aucun passage trouvé. Vérifie le nom de l'arrêt ou la ligne."; return; }
  if (!opts.silencieux) memoriser(question);
  $("statut").textContent = `Mis à jour à ${hhmm(maintenant)}` + (opts.silencieux ? " · auto" : "")
    + (r.tempsReelOk ? "" : " · temps réel indisponible, horaires prévus seulement");

  const groupes = {};
  for (const it of liste) (groupes[it.mode + "|" + it.ligne + "|" + it.sens] ??= []).push(it);
  const lignesAff = [];
  for (const [cle, tous] of Object.entries(groupes)) {
    if (tous.every(i => i.independant)) {   // TER : chaque horaire est un train différent
      lignesAff.push([cle, [...tous].sort((a, b) => a.h - b.h).slice(0, 2)]);
      continue;
    }
    const reels = tous.filter(i => !i.prevu).sort((a, b) => a.h - b.h);
    const prevus = tous.filter(i => i.prevu).sort((a, b) => a.h - b.h);
    const dernierReel = reels.length ? reels[reels.length - 1].h.getTime() + 2 * 60000 : 0;
    const choix = reels.slice(0, 3);
    for (const p of prevus) {
      if (choix.length >= 2) break;
      if (p.h.getTime() > dernierReel) choix.push(p);
    }
    if (choix.length) lignesAff.push([cle, choix]);
  }
  lignesAff.sort((a, b) => a[1][0].h - b[1][0].h);

  let html = `<div class="arret"><h2>${titre(arret)}</h2>`;
  for (const [cle, choix] of lignesAff) {
    const sens = cle.split("|")[2];
    const [premier, ...suivants] = choix;
    const style = premier.couleur ? ` style="background:#${premier.couleur};color:#${premier.texte || "FFFFFF"}"` : "";
    html += `<div class="ligne"><span class="num"${style}><small>${premier.nomMode || ""}</small>${premier.code ?? premier.ligne}</span><span class="sens">→ ${titre(sens)}</span>
             <span class="min">${quand(premier, maintenant)}${suivants.length ? `<small>puis ${suivants.map(p => quand(p, maintenant, true)).join(", ")}</small>` : ""}</span></div>`;
  }
  const favori = lireListe("favoris").includes(question);
  html += `<div class="actions"><button id="btnFavori">${favori ? "★ Dans tes favoris" : "☆ Ajouter aux favoris"}</button><button id="btnEcouter">🔊 Écouter</button></div>`;
  if (VILLE === "LILLE" && lignesAff.some(([, c]) => c[0].mode === "TRAIN"))
    html += `<p class="aide">🎫 Les tickets Ilevia sont valables dans le TER pour voyager entre deux gares de la métropole.
             <a href="https://www.ter.sncf.com/hauts-de-france/tarifs-cartes/autres-tarifs-ter/tarifs-transports-en-commun/voyager-en-ter-aux-tarifs-ilevia">Conditions sur ter.sncf.com</a></p>`;
  html += `</div><div id="trafic"></div><p class="aide">📡 = temps réel · <i>prévu</i> = horaire théorique ${VILLE === "PARIS" ? "Île-de-France Mobilités" : "Ilevia / SNCF"} · mise à jour auto toutes les 30 s</p>`;
  $("resultats").innerHTML = html;
  $("btnFavori").onclick = () => { basculerFavori(question); afficher(r, liste, question, { silencieux: true }); };
  $("btnEcouter").onclick = () => parler(arret, lignesAff);
  if (opts.voix) parler(arret, lignesAff);
  afficherPerturbations(r, lignesAff.map(([cle]) => cle.split("|")[1]));
}

const hhmm = d => d.toLocaleTimeString("fr-FR", { hour: "2-digit", minute: "2-digit" });
function quand(p, maintenant, petit) {
  const min = Math.floor((p.h - maintenant) / 60000);
  const demain = p.h.toDateString() !== maintenant.toDateString();
  if (p.supprime) return `<span class="supprime">${hhmm(p.h)} supprimé</span>`;
  let txt = demain ? `demain ${hhmm(p.h)}` : min <= 0 ? "à l'approche" : min < 60 ? `${min} min` : hhmm(p.h);
  if (p.retard > 0) txt += ` <span class="retard">+${p.retard}</span>`;
  return p.prevu ? `<span class="prevu">${txt} <i>prévu</i></span>` : `${txt}${petit ? "" : " 📡"}`;
}

const titre = s => s.toLowerCase().replace(/(?<=^|[\s(])\S/g, c => c.toUpperCase());

// Questions récentes (gardées sur ce téléphone)
// Listes gardées sur ce téléphone, séparées par ville (« recents » sans suffixe = Lille, pour garder l'historique)
const cleListe = nom => (nom === "recents" && VILLE === "LILLE") ? "recents" : `${nom}_${VILLE}`;
function lireListe(nom) { try { return JSON.parse(localStorage.getItem(cleListe(nom)) || "[]"); } catch { return []; } }
function ecrireListe(nom, l) { try { localStorage.setItem(cleListe(nom), JSON.stringify(l)); } catch {} }
function memoriser(q) {
  ecrireListe("recents", [q, ...lireListe("recents").filter(x => normaliser(x) !== normaliser(q))].slice(0, 5));
  montrerRecents();
}
function basculerFavori(q) {
  const l = lireListe("favoris");
  ecrireListe("favoris", l.includes(q) ? l.filter(x => x !== q) : [...l, q].slice(-6));
  montrerRecents();
}
function montrerRecents() {
  // Favoris : gros boutons ⭐ (✕ pour retirer)
  $("favoris").innerHTML = "";
  for (const q of lireListe("favoris")) {
    const d = document.createElement("div"); d.className = "favori";
    const b = document.createElement("button"); b.textContent = "⭐ " + q;
    b.onclick = () => { $("question").value = q; chercher(q); };
    const x = document.createElement("button"); x.textContent = "✕"; x.className = "retirer"; x.title = "Retirer des favoris";
    x.onclick = () => basculerFavori(q);
    d.append(b, x); $("favoris").appendChild(d);
  }
  // Récents (hors favoris)
  $("recents").innerHTML = "";
  const favs = lireListe("favoris");
  for (const q of lireListe("recents").filter(x => !favs.includes(x))) {
    const b = document.createElement("button");
    b.textContent = q;
    b.onclick = () => { $("question").value = q; chercher(q); };
    $("recents").appendChild(b);
  }
}

// ===================== Réponse à voix haute =====================
function parler(arret, lignesAff) {
  if (!window.speechSynthesis) return;
  const maintenant = new Date();
  const dire = p => {
    const min = Math.floor((p.h - maintenant) / 60000);
    const heure = `${p.h.getHours()} heures ${String(p.h.getMinutes()).padStart(2, "0")}`;
    if (p.h.toDateString() !== maintenant.toDateString()) return `demain à ${heure}`;
    if (min <= 0) return "à l'approche";
    return min < 60 ? `dans ${min} minute${min > 1 ? "s" : ""}` : `à ${heure}`;
  };
  const phrases = lignesAff.slice(0, 4).map(([cle, choix]) => {
    const sens = cle.split("|")[2], p0 = choix[0];
    let t = `${p0.nomMode || "Ligne"} ${(p0.code ?? p0.ligne).split("").join(" ")} vers ${titre(sens).replace(/›/g, ",")} : ${dire(choix[0])}`;
    if (choix[1]) t += `, puis ${dire(choix[1])}`;
    return t + ".";
  });
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(`${titre(arret)}. ${phrases.join(" ")}`);
  u.lang = "fr-FR"; u.rate = 1.05;
  speechSynthesis.speak(u);
}

// ===================== Perturbations =====================
const sansBalises = t => t.replace(/<br\s*\/?>/gi, "\n").replace(/<[^>]+>/g, "").replace(/&nbsp;/g, " ").replace(/\u200b/g, " ").trim();
const echapper = t => t.replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
async function afficherPerturbations(r, lignes) {
  const base = new Set(lignes.map(l => l.replace(/^(C\d+)[AB]$/, "$1")));
  let msgs = [];
  try {
    if (VILLE === "PARIS") {
      const maintenant = new Date();
      for (const d of r.perturbationsParis || []) {
        if (d.status && d.status !== "active") continue;
        const codes = (d.impacted_objects || []).map(o => (LIGNES_IDFM[(o.pt_object?.id || "").split(":").pop()] || {}).code)
                                                .filter(c => c && base.has(c.toUpperCase()));
        const m = (d.messages || []).find(x => (x.channel?.types || []).includes("web")) || (d.messages || [])[0];
        if (codes.length && m) msgs.push({ lignes: [...new Set(codes)], texte: sansBalises(m.text) });
      }
    } else {
      const params = new URLSearchParams({ service: "WFS", version: "2.0.0", request: "GetFeature",
        typeNames: "dsp_ilevia:perturbations", outputFormat: "application/json" });
      const data = await (await fetch(`${WFS}?${params}`)).json();
      for (const f of data.features) {
        const p = f.properties;
        // cible "ILEVIA:LineRef::14:LOC" ; le métro s'écrit ME1/ME2 dans ce flux, M1/M2 dans les horaires
        const code = (p.cible || "").split("::")[1]?.split(":")[0]?.replace(/^ME(\d)$/, "M$1");
        if (code && base.has(code)) msgs.push({ lignes: [code], texte: sansBalises(p.message || "") });
      }
    }
  } catch { return; }
  if (!msgs.length || !$("trafic")) return;
  $("trafic").innerHTML = `<div class="arret trafic"><h2>⚠️ Info trafic</h2>` + msgs.map(m =>
    `<details><summary><b>${m.lignes.map(l => l.replace(/^M(\d)$/, "Métro $1")).join(", ")}</b> · ${echapper(m.texte.slice(0, 70))}${m.texte.length > 70 ? "…" : ""}</summary><p>${echapper(m.texte)}</p></details>`
  ).join("") + `</div>`;
}

// ===================== Mise à jour automatique (toutes les 30 s) =====================
setInterval(() => {
  if (DERNIERE && DERNIERE.ville === VILLE && document.visibilityState === "visible" && $("resultats").innerHTML)
    chercher(DERNIERE.question, { force: DERNIERE.force, silencieux: true });
}, 30000);

// ===================== Autour de moi =====================
const distance = (a, b, c, d) => { // mètres entre deux points GPS
  const R = 6371000, r = x => x * Math.PI / 180;
  const h = Math.sin(r(c - a) / 2) ** 2 + Math.cos(r(a)) * Math.cos(r(c)) * Math.sin(r(d - b) / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(h));
};
let ARRETS_LILLE = null, ARRETS_PARIS = null;
async function autourDeMoi() {
  if (!navigator.geolocation) { $("statut").textContent = "Localisation non disponible sur ce téléphone."; return; }
  $("statut").textContent = "📍 Je cherche où tu es…"; $("resultats").innerHTML = ""; $("proches").innerHTML = "";
  navigator.geolocation.getCurrentPosition(async pos => {
    const { latitude: la, longitude: lo } = pos.coords;
    // Tu es dans une autre ville que celle choisie ? On bascule automatiquement
    const ici = villeProche(la, lo);
    if (ici) { VILLE_GPS = ici; if (ici !== VILLE) { choisirVille(ici); toast(`📍 Ville détectée : ${VILLES.find(v => v.id === ici).nom}`); } else construireBarre(); }
    let proches = [];
    try {
      if (VILLE === "PARIS") {
        // Liste des arrêts d'Île-de-France (régénérée chaque nuit) : calcul des plus proches sur le téléphone
        ARRETS_PARIS ??= await (await fetch("horaires/arrets_paris.json")).json();
        proches = ARRETS_PARIS.map(([num, label, a, b]) => ({ nom: label, m: distance(la, lo, a, b),
            force: { zone: { id: `stop_area:IDFM:${num}`, name: sansCommune(label), label } } }))
          .sort((x, y) => x.m - y.m).slice(0, 5);
      } else {
        ARRETS_LILLE ??= await (await fetch("horaires/arrets.json")).json();
        proches = ARRETS_LILLE.map(([id, nom, commune, a, b]) => ({ nom, m: distance(la, lo, a, b), force: { nom, id, commune } }))
          .sort((x, y) => x.m - y.m).slice(0, 5);
      }
    } catch { $("statut").textContent = "Impossible de trouver les arrêts proches."; return; }
    if (!proches.length || proches[0].m > 3000) { $("statut").textContent = `Aucun arrêt ${VILLE === "PARIS" ? "parisien" : "Ilevia"} près de toi.`; return; }
    $("proches").innerHTML = "";
    for (const p of proches) {
      const b = document.createElement("button");
      b.textContent = `📍 ${titre(p.nom)} · ${Math.round(p.m)} m`;
      b.onclick = () => { $("question").value = titre(p.nom); chercher(p.nom, { force: p.force }); };
      $("proches").appendChild(b);
    }
    $("question").value = titre(proches[0].nom);
    chercher(proches[0].nom, { force: proches[0].force });
  }, err => {
    $("statut").textContent = err.code === 1 ? "Autorise la localisation pour cette page." : "Position introuvable, réessaie dehors.";
  }, { enableHighAccuracy: true, timeout: 15000, maximumAge: 60000 });
}

$("formulaire").onsubmit = e => { e.preventDefault(); $("question").blur(); chercher($("question").value); };

// Micro : appui long = écoute, on relâche = on cherche
const Reco = window.SpeechRecognition || window.webkitSpeechRecognition;
if (!Reco) {
  $("micro").textContent = "🎤 Micro non disponible dans ce navigateur";
  $("micro").disabled = true;
} else {
  const reco = new Reco();
  reco.lang = "fr-FR";
  reco.interimResults = true;
  let texte = "", enCours = false;
  reco.onresult = e => {
    texte = Array.from(e.results).map(r => r[0].transcript).join(" ");
    $("question").value = texte;
  };
  reco.onend = () => {
    enCours = false;
    $("micro").classList.remove("ecoute");
    $("micro").textContent = "🎤 Reste appuyé pour parler";
    if (texte) chercher(texte, { voix: true });
  };
  reco.onerror = e => { $("statut").textContent = e.error === "not-allowed" ? "Autorise le micro pour cette page." : "Je n'ai rien entendu, réessaie."; };
  const debut = e => {
    e.preventDefault();
    if (enCours) return;
    texte = ""; enCours = true;
    $("micro").classList.add("ecoute");
    $("micro").textContent = "🟢 Je t'écoute… relâche pour chercher";
    try { reco.start(); } catch {}
  };
  const fin = e => { e.preventDefault(); if (enCours) reco.stop(); };
  $("micro").addEventListener("pointerdown", debut);
  $("micro").addEventListener("pointerup", fin);
  $("micro").addEventListener("pointercancel", fin);
  $("micro").addEventListener("contextmenu", e => e.preventDefault());
}

if (!VILLES.some(v => v.id === VILLE && v.dispo)) VILLE = "LILLE";
choisirVille(VILLE);
(async () => {
  try {
    if (!navigator.permissions || !navigator.geolocation) return;
    if ((await navigator.permissions.query({ name: "geolocation" })).state !== "granted") return;
    navigator.geolocation.getCurrentPosition(pos => {
      const ici = villeProche(pos.coords.latitude, pos.coords.longitude);
      if (!ici) return;
      VILLE_GPS = ici;
      if (ici !== VILLE) { choisirVille(ici); toast(`📍 Ville détectée : ${VILLES.find(v => v.id === ici).nom}`); }
      else construireBarre();
    }, () => {}, { maximumAge: 300000, timeout: 10000 });
  } catch {}
})();
</script>
