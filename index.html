// ===================== Itinéraire (de A à B) =====================
// Le plan du réseau (horaires/<ville>/reseau.json, refait chaque nuit) donne, pour toute la saison : la suite des arrêts
// de chaque ligne, les temps entre arrêts et les heures de départ de chaque trajet selon le jour.
// Calcul sur le téléphone (Dijkstra « horaire ») : on part à l'heure choisie, on prend le prochain bus à chaque arrêt.
// Deux sortes de résultats : les trajets qui roulent à l'heure choisie (plusieurs critères), puis le trajet « habituel »
// (le plus court sur le plan, sans regarder les horaires) avec, pour chaque ligne, si elle roule ou quand elle reprend.
const ITI = { ville: null, reseau: null, arrets: null, parArret: null, voisins: null, depart: null, arrivee: null, quand: null };
const VITESSE_MARCHE = 75;   // mètres par minute (4,5 km/h), détours compris via le facteur 1,25
const minutesMarche = m => Math.max(1, Math.round(m * 1.25 / VITESSE_MARCHE));
const dossierVille = v => v === "LILLE" ? "lille" : VILLES.find(x => x.id === v)?.gtfs;
const cleJour = d => `${d.getFullYear()}${String(d.getMonth() + 1).padStart(2, "0")}${String(d.getDate()).padStart(2, "0")}`;

async function chargerReseau() {
  if (ITI.ville === VILLE && ITI.reseau) return true;
  const d = dossierVille(VILLE);
  if (!d) return false;
  const [reseau, arrets] = await Promise.all([fetch(`horaires/${d}/reseau.json`).then(r => r.ok ? r.json() : null).catch(() => null),
                                             fetch(`horaires/${d}/arrets.json`).then(r => r.json()).catch(() => [])]);
  if (!reseau || !reseau.jours) return false;
  const pos = {};
  for (const [id, nom, commune, la, lo] of arrets) pos[id] = { id, nom, commune, la, lo };
  const parArret = {};
  reseau.p.forEach((p, i) => {
    // profils de temps (minutes depuis le 1er arrêt) : bornes par arrêt, et profil le plus fréquent pour le « plan seul »
    p.minC = p[2].map((_, k) => Math.min(...p[3].map(c => c[k])));
    p.maxC = p[2].map((_, k) => Math.max(...p[3].map(c => c[k])));
    const nb = new Array(p[3].length).fill(0);
    for (const l of Object.values(p[4])) for (const v of l) nb[v % 1024]++;
    p.cumul = p[3][nb.indexOf(Math.max(...nb))] || p[3][0];
    p[2].forEach((id, k) => (parArret[id] ??= []).push([i, k]));
  });
  // voisins à pied (correspondance à moins de 350 m), avec une grille pour aller vite
  const grille = {};
  for (const a of Object.values(pos)) (grille[`${Math.floor(a.la / 0.004)}:${Math.floor(a.lo / 0.006)}`] ??= []).push(a);
  const voisins = {};
  for (const a of Object.values(pos)) {
    const gi = Math.floor(a.la / 0.004), gj = Math.floor(a.lo / 0.006), l = [];
    for (let di = -1; di <= 1; di++) for (let dj = -1; dj <= 1; dj++)
      for (const b of grille[`${gi + di}:${gj + dj}`] || []) {
        if (b.id === a.id) continue;
        const m = distance(a.la, a.lo, b.la, b.lo);
        if (m < 350) l.push([b.id, m]);
      }
    voisins[a.id] = l;
  }
  Object.assign(ITI, { ville: VILLE, reseau, arrets: pos, parArret, voisins });
  return true;
}

function arretsAutour(la, lo, rayon) {
  const res = [];
  for (const a of Object.values(ITI.arrets)) { const m = distance(la, lo, a.la, a.lo); if (m < rayon) res.push([a.id, m]); }
  return res.sort((x, y) => x[1] - y[1]);
}

// Départs (en minutes depuis minuit du jour choisi) de chaque parcours, la veille, le jour même et les 2 jours suivants
function preparerHoraires(depart) {
  const R = ITI.reseau, minuit = new Date(depart.getFullYear(), depart.getMonth(), depart.getDate());
  const jours = [-1, 0, 1, 2].map(o => [o, R.jours[cleJour(new Date(minuit.getTime() + o * 86400000))] || []]);
  const cache = {};
  return pi => cache[pi] ??= (() => {
    const p = R.p[pi], l = [];
    for (const [o, groupes] of jours) for (const g of groupes) for (const v of p[4][g] || []) l.push([Math.floor(v / 1024) + o * 1440, v % 1024]);
    return l.sort((a, b) => a[0] - b[0]);
  })();
}
// Premier trajet du parcours pi qui passe à l'arrêt n° k à partir de « pret » (minutes) : { dep, prof, passage } ou null
function prochainTrajet(pi, k, pret, horaires) {
  const p = ITI.reseau.p[pi], l = horaires(pi);
  let a = 0, b = l.length;
  const debut = pret - p.maxC[k];
  while (a < b) { const m = (a + b) >> 1; if (l[m][0] < debut) a = m + 1; else b = m; }
  let mieux = null;
  for (let i = a; i < l.length; i++) {
    const [dep, prof] = l[i];
    if (mieux && dep + p.minC[k] > mieux.passage) break;
    const passage = dep + p[3][prof][k];
    if (passage >= pret && (!mieux || passage < mieux.passage)) mieux = { dep, prof, passage };
  }
  return mieux;
}

// Plus court chemin. sources / cibles : { idArret: minutes à pied }. t0 : minutes depuis minuit du jour choisi.
// horaires(pi) -> départs triés ; null = mode « plan seul » (attente fixe de 4 min, toutes les lignes)
function calculerIti(sources, cibles, profil, t0, horaires) {
  const R = ITI.reseau, lab = {}, file = [];
  const pousser = e => { let a = 0, b = file.length; while (a < b) { const m = (a + b) >> 1; if (file[m].cout < e.cout) a = m + 1; else b = m; } file.splice(a, 0, e); };
  const mettre = (id, e) => { const k = id + (e.apresMarche ? "|m" : ""); if (lab[k] && lab[k].cout <= e.cout) return; lab[k] = e; pousser({ ...e, id, k }); };
  for (const [id, m] of Object.entries(sources))
    mettre(id, { cout: m * profil.marche, t: t0 + m, montees: 0, prec: null, etape: m ? { type: "marche", min: m, a: id } : null, apresMarche: true });
  const vus = new Set();
  let meilleur = null;
  while (file.length) {
    const e = file.shift();
    if (vus.has(e.k) || e.cout > (lab[e.k]?.cout ?? Infinity)) continue;
    vus.add(e.k);
    if (meilleur && e.cout >= meilleur.cout) break;
    if (e.id in cibles) {
      const m = cibles[e.id], fin = { cout: e.cout + m * profil.marche, t: e.t + m, prec: e, etape: m ? { type: "marche", min: m, de: e.id, fin: true } : null };
      if (!meilleur || fin.cout < meilleur.cout) meilleur = fin;
    }
    if (!e.apresMarche) for (const [v, m] of ITI.voisins[e.id] || []) {
      const w = minutesMarche(m);
      mettre(v, { cout: e.cout + w * profil.marche + 1, t: e.t + w, montees: e.montees, prec: e, etape: { type: "marche", min: w, de: e.id, a: v }, apresMarche: true });
    }
    for (const [pi, k] of ITI.parArret[e.id] || []) {
      const p = R.p[pi];
      if (k === p[2].length - 1) continue;
      if (e.etape?.type === "ligne" && R.p[e.etape.p][0] === p[0]) continue;   // pas remonter dans la même ligne
      const pret = e.t + (e.montees ? 1 : 0);                                   // 1 min pour changer de quai
      let dep, temps;                                                          // départ du 1er arrêt du trajet pris, et ses temps
      if (horaires) {
        const tr = prochainTrajet(pi, k, pret, horaires);
        if (!tr || tr.passage - pret > 720) continue;                          // rien dans les 12 h
        dep = tr.dep; temps = p[3][tr.prof];
      } else { temps = p.cumul; dep = pret + 4 - temps[k]; }
      const passage = dep + temps[k];
      for (let j = k + 1; j < p[2].length; j++) {
        const t = dep + temps[j];
        mettre(p[2][j], { cout: e.cout + (t - e.t) + (e.montees ? profil.changement : 0), t, montees: e.montees + 1, prec: e, apresMarche: false,
                          etape: { type: "ligne", p: pi, de: e.id, a: p[2][j], arrets: j - k, passage, arrivee: t } });
      }
    }
  }
  if (!meilleur) return null;
  const etapes = [];
  for (let x = meilleur; x; x = x.prec) if (x.etape) etapes.unshift(x.etape);
  return { etapes, changements: Math.max(0, etapes.filter(s => s.type === "ligne").length - 1),
           marche: etapes.filter(s => s.type === "marche").reduce((t, s) => t + s.min, 0) };
}

// Rejoue un trajet à l'heure choisie : heure de chaque bus, ou « ne roule pas, reprend à… »
function chronometrer(o, t0, horaires) {
  const R = ITI.reseau;
  let t = t0;
  for (const s of o.etapes) {
    if (s.type === "marche") { s.debut = t; t += s.min; continue; }
    const p = R.p[s.p], k = p[2].indexOf(s.de), j = p[2].indexOf(s.a, k + 1);
    const pret = t + (s !== o.etapes.find(x => x.type === "ligne") ? 1 : 0);
    const tr = prochainTrajet(s.p, k, pret, horaires);
    if (!tr) { s.passage = null; s.arrivee = null; t += p.cumul[j] - p.cumul[k] + 4; continue; }
    s.passage = tr.passage; s.arrivee = tr.dep + p[3][tr.prof][j]; s.attente = s.passage - pret;
    s.dort = s.attente > 60;      // plus d'une heure d'attente : « ne roule pas à cette heure »
    t = s.arrivee;
  }
  o.arrivee = t;
  o.duree = Math.round(t - t0);
  o.premierDepart = o.etapes.find(x => x.type === "ligne")?.passage ?? null;
  return o;
}

const PROFILS = [
  { nom: "Conseillé", icone: "⭐", changement: 5, marche: 1.5 },
  { nom: "Le plus rapide", icone: "⚡", changement: 1, marche: 1 },
  { nom: "Moins de changements", icone: "🔁", changement: 25, marche: 1.5 },
  { nom: "Moins de marche", icone: "🚶", changement: 5, marche: 4 },
];

function accesLieu(lieu) {
  const res = {};
  if (lieu.ids?.length) {
    for (const id of lieu.ids) if (ITI.arrets[id]) { res[id] = 0; for (const [v, m] of ITI.voisins[id] || []) res[v] ??= minutesMarche(m); }
    return res;
  }
  let autour = arretsAutour(lieu.la, lieu.lo, 700);
  if (autour.length < 3) autour = arretsAutour(lieu.la, lieu.lo, 1500).slice(0, 8);
  for (const [id, m] of autour.slice(0, 25)) res[id] = minutesMarche(m);
  return res;
}

// ---------- Écran ----------
const pastilleLigne = l => {
  const [code, type, couleur, texte] = l;
  const mode = { 0: "Tram", 1: "Métro", 2: "Train", 4: "Bateau", 5: "Tram", 6: "Téléph.", 7: "Funic." }[type] || "Bus";
  const affiche = type === 1 ? String(code).replace(/^M(?=\d)/, "") : String(code).toUpperCase().replace(/^0+(?=\d)/, "");
  return `<span class="num" style="background:#${couleur || "1e2761"};color:#${texte || "FFFFFF"}"><small>${mode}</small>${echapper(affiche)}</span>`;
};
const nomArret = id => titre(ITI.arrets[id]?.nom || "?");
// Lille : C1 et C3 sont des boucles ; le côté (A ou B) se lit dans l'ordre des arrêts, comme dans l'appli Ilevia
const REPERES_BOUCLES = { C1: ["CORMONTAIGNE", "CHU EURASANTE"], C3: ["C H DRON", "TOURCOING GARE"] };
function ligneIti(pi) {
  const R = ITI.reseau, p = R.p[pi], l = [...R.l[p[0]]];
  const rep = VILLE === "LILLE" && REPERES_BOUCLES[l[0]];
  if (rep) {
    const noms = p[2].map(id => ITI.arrets[id]?.nom), i = noms.indexOf(rep[0]), j = noms.indexOf(rep[1]);
    if (i >= 0 && j >= 0) { const cote = i < j ? "A" : "B"; return { l: [l[0] + cote, ...l.slice(1)], sens: BOUCLES[l[0]].sens[cote] }; }
  }
  return { l, sens: titre(p[1]) };
}
// minutes depuis minuit du jour choisi -> « 00:18 », « demain 05:42 »
function heureIti(min) {
  const base = ITI.quand || new Date(), d = new Date(base.getFullYear(), base.getMonth(), base.getDate(), 0, Math.round(min));
  const jours = Math.round((new Date(d.getFullYear(), d.getMonth(), d.getDate()) - new Date(new Date().setHours(0, 0, 0, 0))) / 86400000);
  return (jours === 1 ? "demain " : jours > 1 ? d.toLocaleDateString("fr-FR", { weekday: "short", day: "numeric", month: "short" }) + " " : "") + hhmm(d);
}

function ouvrirItineraire() {
  document.body.classList.add("iti");
  window.scrollTo(0, 0);
  if (!ITI.depart) ITI.depart = { nom: "📍 Ma position", position: true };
  $("itiDepart").value = ITI.depart.nom; $("itiArrivee").value = ITI.arrivee?.nom || "";
  majQuand();
  $("itiResultats").innerHTML = VILLE === "PARIS"
    ? `<p class="aide">Pour Paris, l'itinéraire passe par Google Maps (le plan complet de l'Île-de-France est trop gros pour le téléphone).</p>` : "";
  history.pushState({ iti: true }, "");
}
function fermerItineraire() { document.body.classList.remove("iti"); $("itiSuggestions").innerHTML = ""; }
window.addEventListener("popstate", () => { if (document.body.classList.contains("iti")) fermerItineraire(); });

// « Partir maintenant » / « Partir à… »
function majQuand() {
  const plus = !!ITI.quand;
  $("itiMaintenant").classList.toggle("actif", !plus); $("itiPlusTard").classList.toggle("actif", plus);
  $("itiHeure").hidden = !plus;
  if (plus) { const d = ITI.quand, v = new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().slice(0, 16); if ($("itiHeure").value !== v) $("itiHeure").value = v; }
}
$("itiMaintenant").onclick = () => { ITI.quand = null; majQuand(); if (ITI.depart && ITI.arrivee) lancerItineraire(); };
$("itiPlusTard").onclick = () => { ITI.quand ??= new Date(Date.now() + 3600000); majQuand(); };
$("itiHeure").onchange = () => { const d = new Date($("itiHeure").value); if (!isNaN(d)) { ITI.quand = d; if (ITI.depart && ITI.arrivee) lancerItineraire(); } };

let MINUTERIE_ADRESSE = null;
async function suggerer(champ) {
  const q = $(champ === "depart" ? "itiDepart" : "itiArrivee").value.trim();
  const boite = $("itiSuggestions");
  boite.dataset.champ = champ;
  const choix = [];
  if (champ === "depart") choix.push({ nom: "📍 Ma position", position: true });
  if (q.length < 2) {
    for (const f of lireListe("favoris")) { const n = nomFavori(f); choix.push({ nom: "⭐ " + n, recherche: f.f ? null : n, force: f.f || null }); }
  } else if (await chargerReseau()) {
    const mots = analyser(q).arret, vus = new Set();
    const noms = [...new Set(Object.values(ITI.arrets).map(a => a.nom))];
    const notes = noms.map(n => { const nw = motsUtiles(n); const ok = mots.filter(m => nw.some(w => proche(w, m) || w.startsWith(m))).length; return [n, ok, nw.length]; })
      .filter(x => x[1] === mots.length && x[1] > 0)
      .sort((a, b) => (motsUtiles(b[0]).join(" ") === mots.join(" ")) - (motsUtiles(a[0]).join(" ") === mots.join(" ")) || a[2] - b[2]).slice(0, 6);
    for (const [n] of notes) {
      if (vus.has(n)) continue; vus.add(n);
      // même nom à plusieurs endroits (Wagner à Lille et à Wattrelos) : une proposition par endroit, avec la commune
      const secteurs = [];
      for (const a of Object.values(ITI.arrets).filter(a => a.nom === n)) {
        const sct = secteurs.find(x => distance(x.la, x.lo, a.la, a.lo) < 1000);
        if (sct) sct.ids.push(a.id); else secteurs.push({ la: a.la, lo: a.lo, ids: [a.id], commune: a.commune });
      }
      for (const sct of secteurs) {
        const precision = secteurs.length > 1 ? ` (${sct.commune || voisinDe(Object.values(ITI.arrets).map(a => [a.id, a.nom, a.commune, a.la, a.lo]), sct.la, sct.lo, n)})` : "";
        choix.push({ nom: titre(n) + precision, ids: sct.ids });
      }
    }
  }
  afficherSuggestions(choix);
  clearTimeout(MINUTERIE_ADRESSE);
  if (q.length >= 4 && /\d|rue|avenue|bd|boulevard|place|chemin|allée|route|impasse|quai/i.test(q)) MINUTERIE_ADRESSE = setTimeout(async () => {
    const [la, lo] = POSITION || villeActuelle().centre || [];
    const params = `q=${encodeURIComponent(q)}&limit=4${la ? `&lat=${la}&lon=${lo}` : ""}`;
    let feats = [];
    try { feats = (await (await fetch(`https://data.geopf.fr/geocodage/search?${params}`)).json()).features || []; }
    catch { try { feats = (await (await fetch(`https://api-adresse.data.gouv.fr/search/?${params}`)).json()).features || []; } catch {} }
    if ($(champ === "depart" ? "itiDepart" : "itiArrivee").value.trim() !== q) return;
    afficherSuggestions([...choix, ...feats.map(f => ({ nom: "🏠 " + f.properties.label, la: f.geometry.coordinates[1], lo: f.geometry.coordinates[0] }))]);
  }, 350);
}
function afficherSuggestions(choix) {
  const boite = $("itiSuggestions"), champ = boite.dataset.champ;
  boite.innerHTML = "";
  for (const c of choix.slice(0, 10)) {
    const b = document.createElement("button");
    b.textContent = c.nom;
    b.onclick = () => {
      ITI[champ === "depart" ? "depart" : "arrivee"] = c;
      $(champ === "depart" ? "itiDepart" : "itiArrivee").value = c.nom;
      boite.innerHTML = "";
      if (ITI.depart && ITI.arrivee) lancerItineraire();
    };
    boite.appendChild(b);
  }
}

async function preparerLieu(l) {
  if (l.position) {
    if (!POSITION) POSITION = await new Promise((ok, ko) => navigator.geolocation.getCurrentPosition(p => ok([p.coords.latitude, p.coords.longitude]), ko, { timeout: 10000, maximumAge: 60000 }));
    return { la: POSITION[0], lo: POSITION[1] };
  }
  if (l.force?.ids || l.force?.id) return { ids: l.force.ids || [l.force.id] };
  if (l.ids) return { ids: l.ids };
  if (l.la) return { la: l.la, lo: l.lo };
  const n = meilleurNom([...new Set(Object.values(ITI.arrets).map(a => a.nom))], analyser(l.recherche || l.nom).arret);
  return n ? { ids: Object.values(ITI.arrets).filter(a => a.nom === n).map(a => a.id) } : null;
}

async function lancerItineraire() {
  const zone = $("itiResultats");
  $("itiSuggestions").innerHTML = "";
  if (!ITI.arrivee && $("itiArrivee").value.trim()) ITI.arrivee = { nom: $("itiArrivee").value.trim(), recherche: $("itiArrivee").value.trim() };
  if (!ITI.depart && $("itiDepart").value.trim()) ITI.depart = { nom: $("itiDepart").value.trim(), recherche: $("itiDepart").value.trim() };
  if (!ITI.depart || !ITI.arrivee) { zone.innerHTML = `<p class="aide">Choisis le départ et l'arrivée.</p>`; return; }
  if (VILLE === "PARIS" || !(await chargerReseau())) { zone.innerHTML = lienGoogle(); return; }
  zone.innerHTML = `<p class="aide">Je cherche…</p>`;
  let a, b;
  try { [a, b] = await Promise.all([preparerLieu(ITI.depart), preparerLieu(ITI.arrivee)]); }
  catch { zone.innerHTML = `<p class="aide">Je n'arrive pas à trouver ta position. Autorise la localisation ou choisis un arrêt de départ.</p>`; return; }
  if (!a || !b) { zone.innerHTML = `<p class="aide">Je ne trouve pas ${!a ? "le départ" : "l'arrivée"}. Choisis-le dans la liste.</p>`; return; }
  const sources = accesLieu(a), cibles = accesLieu(b);
  if (!Object.keys(sources).length || !Object.keys(cibles).length) { zone.innerHTML = `<p class="aide">Aucun arrêt près ${!Object.keys(sources).length ? "du départ" : "de l'arrivée"}.</p>` + lienGoogle(); return; }
  const pa = a.la ? [a.la, a.lo] : [ITI.arrets[a.ids[0]].la, ITI.arrets[a.ids[0]].lo];
  const pb = b.la ? [b.la, b.lo] : [ITI.arrets[b.ids[0]].la, ITI.arrets[b.ids[0]].lo];
  const aPied = minutesMarche(distance(...pa, ...pb));
  const quand = ITI.quand || new Date(), t0 = quand.getHours() * 60 + quand.getMinutes();
  const horaires = preparerHoraires(quand);
  const signature = r => r.etapes.filter(s => s.type === "ligne").map(s => `${ITI.reseau.p[s.p][0]}@${s.de}>${s.a}`).join(",");
  // 1) trajets qui roulent à l'heure choisie, selon chaque critère
  const options = [], vus = new Set();
  for (const pr of PROFILS) {
    const r = calculerIti(sources, cibles, pr, t0, horaires);
    if (!r) continue;
    const sig = signature(r);
    if (vus.has(sig)) { options.find(o => o.sig === sig).noms.push(pr.icone + " " + pr.nom); continue; }
    vus.add(sig);
    options.push(chronometrer({ ...r, sig, noms: [pr.icone + " " + pr.nom] }, t0, horaires));
  }
  // 2) trajet habituel (plan seul) : toujours proposé, avec l'état de chaque ligne à l'heure choisie
  const habituel = calculerIti(sources, cibles, PROFILS[0], t0, null);
  if (habituel && !vus.has(signature(habituel))) options.push(chronometrer({ ...habituel, sig: signature(habituel), noms: ["🗺️ Trajet habituel"], habituel: true }, t0, horaires));
  else if (habituel) options.find(o => o.sig === signature(habituel))?.noms.push("🗺️ Trajet habituel");
  if (!options.length) { zone.innerHTML = `<p class="aide">Aucune ligne ne relie ces deux endroits.</p>` + lienGoogle(pa, pb); return; }
  options.sort((x, y) => (x.habituel - y.habituel) || 0);
  zone.innerHTML = (aPied <= 20 ? `<p class="aide">🚶 À pied : environ ${aPied} min.</p>` : "")
    + options.map((o, i) => carteIti(o, i, t0)).join("") + lienGoogle(pa, pb);
  zone.querySelectorAll(".carteIti").forEach(c => c.onclick = e => { if (!e.target.closest(".arretIti")) c.classList.toggle("ouverte"); });
  zone.querySelectorAll(".arretIti").forEach(btn => btn.onclick = () => {
    const id = btn.dataset.id, nom = ITI.arrets[id].nom;
    fermerItineraire(); history.back();
    $("question").value = titre(nom);
    chercher(titre(nom), { force: { nom, ids: [id], id, commune: "" } });
  });
}

function carteIti(o, i, t0) {
  const R = ITI.reseau, lignes = o.etapes.filter(s => s.type === "ligne");
  const dort = lignes.some(s => s.dort || s.passage === null);
  const etat = s => s.passage === null ? `<span class="dortIti">🌙 ne roule pas ces jours-ci</span>`
    : s.dort ? `<span class="dortIti">🌙 ne roule pas à cette heure · reprend ${heureIti(s.passage)}</span>`
    : `<span class="rouleIti">✅ ${heureIti(s.passage)}</span>`;
  const etapes = o.etapes.map(s => {
    const bouton = id => `<button class="arretIti" data-id="${id}">${echapper(nomArret(id))}</button>`;
    if (s.type === "marche") return `<li>🚶 ${s.min} min à pied${s.a && !s.fin ? ` jusqu'à ${bouton(s.a)}` : s.fin ? " jusqu'à l'arrivée" : ""}</li>`;
    const li = ligneIti(s.p);
    return `<li>${pastilleLigne(li.l)} direction <b>${echapper(li.sens)}</b> ${etat(s)}<br>Monte à ${bouton(s.de)}, descends à ${bouton(s.a)}
            <small>(${s.arrets} arrêt${s.arrets > 1 ? "s" : ""}${s.arrivee !== null ? `, arrivée ${heureIti(s.arrivee)}` : ""})</small></li>`;
  }).join("");
  const noms = o.noms.length >= 3 && !o.habituel ? ["⭐ Le meilleur trajet"] : o.noms;
  const depart = o.etapes[0]?.type === "marche" ? o.premierDepart - o.etapes[0].min : o.premierDepart;
  return `<div class="carteIti${i === 0 ? " ouverte" : ""}${dort ? " dortCarte" : ""}"><div class="enteteIti"><span class="nomsIti">${noms.join(" · ")}</span>
    <span class="dureeIti">${dort ? "" : `${o.duree} min`}</span></div>
    <div class="lignesIti">${lignes.map(s => pastilleLigne(ligneIti(s.p).l)).join(`<span class="fleche">›</span>`)}</div>
    <div class="aide" style="margin:6px 0 0">${dort ? "🌙 Une ligne ne roule pas à cette heure-là"
      : `Départ ${heureIti(Math.max(t0, depart ?? t0))} · arrivée ${Math.floor(o.arrivee / 1440) === Math.floor(Math.max(t0, depart ?? t0) / 1440) ? heureIti(o.arrivee).split(" ").pop() : heureIti(o.arrivee)}`} · ${o.changements ? `${o.changements} changement${o.changements > 1 ? "s" : ""}` : "direct"}${o.marche ? ` · ${o.marche} min à pied` : ""}</div>
    <ol class="etapesIti">${etapes}</ol></div>`;
}

function lienGoogle(pa, pb) {
  const dest = pb ? `${pb[0]},${pb[1]}` : encodeURIComponent((ITI.arrivee?.nom || "").replace(/^[^\p{L}\d]+/u, "") + " " + (villeActuelle().nom || ""));
  const orig = pa ? `&origin=${pa[0]},${pa[1]}` : "";
  return `<p class="aide"><a href="https://www.google.com/maps/dir/?api=1${orig}&destination=${dest}&travelmode=transit" target="_blank" rel="noopener">Voir aussi dans Google Maps ›</a></p>`;
}

$("itiBtn").onclick = ouvrirItineraire;
$("itiRetour").onclick = () => history.back();
$("itiDepart").oninput = () => { ITI.depart = null; suggerer("depart"); };
$("itiArrivee").oninput = () => { ITI.arrivee = null; suggerer("arrivee"); };
$("itiDepart").onfocus = () => suggerer("depart");
$("itiArrivee").onfocus = () => suggerer("arrivee");
$("itiInverser").onclick = () => { [ITI.depart, ITI.arrivee] = [ITI.arrivee, ITI.depart]; $("itiDepart").value = ITI.depart?.nom || ""; $("itiArrivee").value = ITI.arrivee?.nom || ""; if (ITI.depart && ITI.arrivee) lancerItineraire(); };
$("itiOk").onclick = lancerItineraire;

if (!VILLES.some(v => v.id === VILLE && v.dispo)) VILLE = "LILLE";
choisirVille(VILLE);
(async () => {
  try {
    if (!navigator.permissions || !navigator.geolocation) return;
    if ((await navigator.permissions.query({ name: "geolocation" })).state !== "granted") return;
    navigator.geolocation.getCurrentPosition(pos => {
      POSITION = [pos.coords.latitude, pos.coords.longitude];
      const ici = villeProche(pos.coords.latitude, pos.coords.longitude);
      if (!ici) return;
      VILLE_GPS = ici;
      if (ici !== VILLE) { choisirVille(ici); toast(`📍 Ville détectée : ${VILLES.find(v => v.id === ici).nom}`); }
      else construireBarre();
    }, () => {}, { maximumAge: 300000, timeout: 10000 });
  } catch {}
})();
